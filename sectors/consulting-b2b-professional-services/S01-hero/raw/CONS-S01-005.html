body { margin: 0; background: #f3f2f7; }

.cons-s01-005 {

.cons-s01-005 figcaption .mk { color: var(--accent); }

.cons-s01-005 .say { position: relative; padding: clamp(2rem, 5vw, 5rem) 0 0 clamp(1.6rem, 3vw, 3rem); }

.cons-s01-005 .foot { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 1.2rem clamp(1.5rem, 3vw, 3rem); align-items: center; margin-top: clamp(2rem, 4vw, 3.4rem); padding-top: 1.2rem; border-top: 1px solid var(--line-strong); }
