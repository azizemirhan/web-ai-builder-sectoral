<!--
  WebAIBuilder — Sector Design Authoring Workspace
  Raw study. Standalone HTML. Scoped CSS. No framework, CDN, or remote runtime dependency.

  Study ID       : CONS-S01-005
  Sector         : Consulting & B2B Professional Services (CONS)
  Section        : CONS-S01 — Hero
  Direction      : Art-directed / Distinctive
  Theme          : 005 Midnight — see ../../CONSULTING-THEME-CONTRACT.md
  Layout model   : Near-black field, a tall reserved portrait held left, and an oversized line in
                   the right column that crosses back over the portrait's edge
  Density        : Low (50 visible words) — joint lowest with 002, by a different route
  Media mode     : One tall reserved portrait area, the largest media field of the five studies.
                   The label states what the photograph is — a partner mid-sentence rather than
                   posed against a window — because the sector's stock-portrait failure is the
                   pose, not the subject.
  Interaction    : None (static; no JavaScript)

  Why the crossing line : The distinction in this direction has to come from composition, not from
                   a device bolted on. Here the type is set in the right column but pulled back
                   across the portrait's edge, so the line and the person occupy the same space —
                   which is the argument the copy is making. The overlap releases at 860px and the
                   two stack, because a crossing that becomes an overlap on a phone is a defect.

  Content note   : The counters carry PLACEHOLDER DEMO VALUES (founded 1998, 340+ engagements,
                   6 offices), marked data-placeholder="true" in the markup and declared in the
                   meta block, so ingestion can find and clear every one of them. They exist so the
                   composition can be judged with content in it. They are not claims and must be
                   replaced before any real use. Still excluded, demo or not: named clients, logos,
                   rankings, awards, certifications, and any figure asserting a measurement nobody
                   ran. No header or navigation — the section-shell rule.
-->

<title>CONS-S01-005 — Hero, Art-directed / Distinctive</title>

<style>
/* Standalone host baseline */
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: #0b0d12; }

/* Scoped study styles — namespaced to .cons-s01-005 */
.cons-s01-005 {
  --paper: #0b0d12;
  --ink: #f2f3f5;
  --ink-soft: #989ca6;
  --line: #272b33;
  --slot: #14171e;
  --slot-edge: #474d58;
  --slot-ink: #c6cad1;
  --accent: #7c6cf7;
  --accent-ink: #0b0d12;
  --focus: #7c6cf7;

  box-sizing: border-box;
  display: block;
  background: var(--paper);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 1.06rem;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
.cons-s01-005 *,
.cons-s01-005 *::before,
.cons-s01-005 *::after { box-sizing: inherit; }
.cons-s01-005 :focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; border-radius: 12px; }
.cons-s01-005 .vh {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip-path: inset(50%); white-space: nowrap;
}

.cons-s01-005 .shell {
  width: 100%; max-width: 1320px; margin: 0 auto;
  padding: clamp(48px, 5.8vw, 108px) clamp(22px, 3.6vw, 58px);
}

/* --- The stage: portrait left, line crossing back over it from the right --- */
.cons-s01-005 .stage {
  display: grid;
  grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.08fr);
  align-items: center;
}
.cons-s01-005 .portrait {
  grid-column: 1;
  border: 2px dashed var(--slot-edge);
  border-radius: 26px;
  background: linear-gradient(158deg, #1c2029 0%, #14171e 60%, #101319 100%);
  aspect-ratio: 3 / 4;
  display: grid;
  place-items: center;
  padding: 24px;
}
.cons-s01-005 .portrait span {
  color: var(--slot-ink);
  font-size: 0.8rem;
  font-weight: 700;
  letter-spacing: 0.085em;
  text-transform: uppercase;
  text-align: center;
  line-height: 1.85;
}
.cons-s01-005 .say {
  grid-column: 2;
  position: relative;
  z-index: 2;
  margin-left: clamp(-140px, -7vw, -40px);
}
.cons-s01-005 .eyebrow {
  margin: 0 0 clamp(16px, 2vw, 26px);
  font-size: 0.8rem;
  font-weight: 750;
  letter-spacing: 0.085em;
  text-transform: uppercase;
  color: var(--accent);
}
.cons-s01-005 h1 {
  margin: 0;
  font-size: clamp(2.4rem, 5.4vw, 4.5rem);
  line-height: 0.97;
  letter-spacing: -0.044em;
  font-weight: 800;
  text-wrap: balance;
}
.cons-s01-005 h1 em { font-style: normal; color: var(--accent); }
.cons-s01-005 .lead {
  margin: clamp(20px, 2.4vw, 30px) 0 0;
  max-width: 40ch;
  color: var(--ink-soft);
  font-size: clamp(1.06rem, 1.28vw, 1.22rem);
}

/* --- Foot: action and one reserved figure --- */
.cons-s01-005 .foot {
  margin: clamp(30px, 3.6vw, 46px) 0 0;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: clamp(18px, 3vw, 40px);
}
.cons-s01-005 .go {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  min-height: 56px;
  padding: 0 30px;
  border-radius: 999px;
  background: var(--accent);
  color: var(--accent-ink);
  font-size: 1.04rem;
  font-weight: 800;
  text-decoration: none;
}
.cons-s01-005 .go:hover { background: var(--ink); }
.cons-s01-005 .fig { margin: 0; display: flex; align-items: center; gap: 12px; }
.cons-s01-005 .slot {
  display: inline-block;
  color: var(--ink);
  font-size: clamp(1.56rem, 2.1vw, 1.95rem);
  font-weight: 800;
  letter-spacing: -0.035em;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.cons-s01-005 .fname {
  font-size: 0.8rem;
  font-weight: 700;
  letter-spacing: 0.075em;
  text-transform: uppercase;
  color: var(--ink-soft);
  max-width: none;
  line-height: 1.5;
  white-space: nowrap;
}

/* --- Responsive ladder: the crossing releases before anything else --- */
@media (max-width: 860px) {
  .cons-s01-005 .stage { grid-template-columns: minmax(0, 1fr); }
  .cons-s01-005 .portrait { grid-column: 1; aspect-ratio: 16 / 9; }
  .cons-s01-005 .say {
    grid-column: 1;
    margin-left: 0;
    margin-top: clamp(26px, 3.4vw, 42px);
  }
  .cons-s01-005 .lead { max-width: none; }
}
@media (max-width: 560px) {
  .cons-s01-005 .portrait { aspect-ratio: 4 / 5; }
  .cons-s01-005 .go { width: 100%; justify-content: center; }
  .cons-s01-005 .fname { max-width: none; }
}
@media (prefers-reduced-motion: reduce) {
  .cons-s01-005 * { transition: none !important; }
}
</style>
</head>
<body>

<div class="cons-s01-005" data-study-id="CONS-S01-005" data-direction="Art-directed / Distinctive">
  <section class="shell" aria-labelledby="cons-s01-005-title">

    <div class="stage">
      <div class="portrait"><span>Portrait area &mdash; a partner mid-sentence,<br>not posed against a window</span></div>
      <div class="say">
        <p class="eyebrow">Advisory</p>
        <h1 id="cons-s01-005-title">You are not buying a deck. You are buying somebody being <em>sure</em>.</h1>
        <p class="lead">And able to say why, in front of the people who will have to live with it.</p>
        <div class="foot">
          <a class="go" href="#cons-s01-005-title">Start a conversation</a>
          <p class="fig">
            <span class="slot" data-placeholder="true">1998</span>
            <span class="fname">In practice since</span>
          </p>
        </div>
      </div>
    </div>

  </section>
</div>

</body>
</html>
