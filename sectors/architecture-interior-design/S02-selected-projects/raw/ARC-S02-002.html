<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARC-S02-002 — Selected Works Editorial</title>
  <meta name="description" content="An asymmetric editorial selected-works study for architecture studios.">
  <style>
    body { margin: 0; background: #eee9df; }
    #arc-s02-002 {
      --ink: #171714;
      --rust: #a54225;
      --paper: #eee9df;
      box-sizing: border-box;
      min-height: 100vh;
      padding: clamp(2.5rem, 6vw, 7rem) clamp(1rem, 4vw, 4rem);
      color: var(--ink);
      background: var(--paper);
      font-family: Arial, Helvetica, sans-serif;
    }
    #arc-s02-002 *, #arc-s02-002 *::before, #arc-s02-002 *::after { box-sizing: border-box; }
    #arc-s02-002 .spread {
      display: grid;
      grid-template-columns: minmax(3.5rem, .35fr) repeat(10, 1fr);
      grid-template-rows: auto auto minmax(8rem, auto) auto;
      gap: 1.2rem;
      width: min(100%, 100rem);
      margin: 0 auto;
    }
    #arc-s02-002 .folio {
      grid-column: 1;
      grid-row: 1 / 5;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: .35rem;
      border-right: 1px solid rgba(23,23,20,.35);
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
    }
    #arc-s02-002 .masthead { grid-column: 2 / 8; grid-row: 1; z-index: 2; }
    #arc-s02-002 .kicker { margin: 0 0 .8rem; color: var(--rust); font-size: .68rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
    #arc-s02-002 h1 {
      max-width: 8ch;
      margin: 0;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(3.5rem, 9vw, 9rem);
      font-weight: 400;
      line-height: .78;
      letter-spacing: -.065em;
    }
    #arc-s02-002 .statement {
      grid-column: 8 / 12;
      grid-row: 1;
      align-self: end;
      max-width: 28rem;
      margin: 0 0 .3rem auto;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(1rem, 1.55vw, 1.35rem);
      line-height: 1.45;
    }
    #arc-s02-002 figure { margin: 0; min-width: 0; }
    #arc-s02-002 .work-a { grid-column: 3 / 9; grid-row: 2 / 4; margin-top: 1rem; }
    #arc-s02-002 .work-b { grid-column: 9 / 12; grid-row: 2; margin-top: 5.5rem; }
    #arc-s02-002 .work-c { grid-column: 2 / 5; grid-row: 4; margin-top: -3.5rem; }
    #arc-s02-002 .work-d { grid-column: 6 / 11; grid-row: 4; margin-top: 2.5rem; }
    #arc-s02-002 .plate {
      position: relative;
      min-height: 13rem;
      overflow: hidden;
      border: 1px solid rgba(23,23,20,.24);
      background: #c8c3b8;
      isolation: isolate;
    }
    #arc-s02-002 .work-a .plate { aspect-ratio: 1.35 / 1; }
    #arc-s02-002 .work-b .plate { aspect-ratio: .78 / 1; }
    #arc-s02-002 .work-c .plate { aspect-ratio: .92 / 1; }
    #arc-s02-002 .work-d .plate { aspect-ratio: 1.75 / 1; }
    #arc-s02-002 .plate::before,
    #arc-s02-002 .plate::after { content: ''; position: absolute; }
    #arc-s02-002 .plate::before {
      inset: 0;
      z-index: -2;
      background:
        linear-gradient(125deg, transparent 0 48%, rgba(18,18,15,.24) 48.2% 49%, transparent 49.2%),
        linear-gradient(0deg, #6c665c 0 18%, #b8b0a2 18% 52%, #dad8cf 52%);
    }
    #arc-s02-002 .plate::after {
      inset: 20% 9% 14% 20%;
      z-index: -1;
      border: 1px solid rgba(20,20,17,.5);
      background:
        repeating-linear-gradient(90deg, transparent 0 19%, rgba(255,255,255,.5) 19.4% 20%),
        linear-gradient(160deg, rgba(255,255,255,.25), rgba(82,69,55,.3));
      box-shadow: -1.8rem 1.4rem 0 rgba(129,63,37,.18);
    }
    #arc-s02-002 .work-b .plate::before { filter: grayscale(1) contrast(.82) brightness(1.12); transform: scaleX(-1); }
    #arc-s02-002 .work-c .plate::before { filter: sepia(.2) hue-rotate(330deg) brightness(.85); }
    #arc-s02-002 .work-d .plate::before { filter: grayscale(.65) hue-rotate(60deg); transform: scaleX(-1); }
    #arc-s02-002 .slot { position: absolute; top: .8rem; right: .8rem; padding: .35rem .45rem; color: #f5f1e8; background: rgba(20,20,17,.68); font-size: .6rem; letter-spacing: .14em; text-transform: uppercase; }
    #arc-s02-002 figcaption { display: grid; grid-template-columns: auto 1fr; gap: .9rem; padding-top: .75rem; }
    #arc-s02-002 .index { color: var(--rust); font-family: Georgia, 'Times New Roman', serif; font-size: 1.25rem; }
    #arc-s02-002 h2 { margin: 0; font-family: Georgia, 'Times New Roman', serif; font-size: clamp(1.25rem, 2vw, 1.8rem); font-weight: 400; }
    #arc-s02-002 .meta { margin: .3rem 0 0; color: #5b574f; font-size: .68rem; font-weight: 700; letter-spacing: .12em; line-height: 1.45; text-transform: uppercase; }
    #arc-s02-002 .work-link { display: inline-block; min-height: 2.75rem; padding-top: .75rem; color: var(--ink); font-size: .78rem; text-underline-offset: .25rem; }
    #arc-s02-002 .work-link:hover { color: var(--rust); }
    #arc-s02-002 a:focus-visible { outline: 3px solid var(--rust); outline-offset: 4px; }
    @media (max-width: 64rem) {
      #arc-s02-002 .spread { grid-template-columns: 3rem repeat(8, 1fr); }
      #arc-s02-002 .masthead { grid-column: 2 / 7; }
      #arc-s02-002 .statement { grid-column: 7 / 10; }
      #arc-s02-002 .work-a { grid-column: 2 / 7; }
      #arc-s02-002 .work-b { grid-column: 7 / 10; }
      #arc-s02-002 .work-c { grid-column: 2 / 5; }
      #arc-s02-002 .work-d { grid-column: 5 / 10; }
    }
    @media (max-width: 48rem) {
      #arc-s02-002 .spread { grid-template-columns: 2rem repeat(6, 1fr); grid-template-rows: auto; }
      #arc-s02-002 .folio { grid-row: 1 / 7; }
      #arc-s02-002 .masthead, #arc-s02-002 .statement, #arc-s02-002 .work-a, #arc-s02-002 .work-b, #arc-s02-002 .work-c, #arc-s02-002 .work-d { grid-column: 2 / 8; grid-row: auto; margin: 0; }
      #arc-s02-002 .statement { max-width: 30rem; margin: 1rem 0 2rem; }
      #arc-s02-002 .work-b, #arc-s02-002 .work-d { margin-left: 12%; }
      #arc-s02-002 .work-c { margin-right: 12%; }
      #arc-s02-002 .plate { min-height: 0; }
      #arc-s02-002 .work-a .plate, #arc-s02-002 .work-b .plate, #arc-s02-002 .work-c .plate, #arc-s02-002 .work-d .plate { aspect-ratio: 4 / 3; }
    }
    @media (max-width: 27rem) {
      #arc-s02-002 { padding-inline: .75rem; }
      #arc-s02-002 .spread { grid-template-columns: 1.4rem repeat(6, 1fr); gap: 1rem .65rem; }
      #arc-s02-002 .work-b, #arc-s02-002 .work-c, #arc-s02-002 .work-d { margin-inline: 0; }
      #arc-s02-002 h1 { font-size: clamp(3.2rem, 20vw, 5rem); }
    }
    @media (prefers-reduced-motion: reduce) { #arc-s02-002 * { scroll-behavior: auto !important; } }
  </style>
