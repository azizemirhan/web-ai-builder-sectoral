<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARC-S02-001 — Selected Projects Mosaic</title>
  <meta name="description" content="A reusable selected-projects mosaic for architecture and interior design studios.">
  <style>
    body { margin: 0; background: #f3efe8; }
    #arc-s02-001 { --ink:#20201d; --muted:#6d6a63; --line:#c7bfb2; --accent:#9a5c3d; box-sizing:border-box; min-height:100vh; padding:clamp(2rem,6vw,6rem) clamp(1rem,5vw,5rem); color:var(--ink); background:#f3efe8; font-family:Arial,Helvetica,sans-serif; }
    #arc-s02-001 *, #arc-s02-001 *::before, #arc-s02-001 *::after { box-sizing:border-box; }
    #arc-s02-001 .layout { display:grid; grid-template-columns:minmax(13rem,.55fr) minmax(0,2fr); gap:clamp(2rem,5vw,5rem); width:min(100%,96rem); margin:0 auto; }
    #arc-s02-001 .intro { align-self:center; }
    #arc-s02-001 .eyebrow { margin:0 0 1rem; color:var(--accent); font-size:.65rem; font-weight:700; letter-spacing:.16em; text-transform:uppercase; }
    #arc-s02-001 h1 { max-width:8ch; margin:0; font-family:Georgia,'Times New Roman',serif; font-size:clamp(2.8rem,5vw,5.8rem); font-weight:400; line-height:.9; letter-spacing:-.045em; }
    #arc-s02-001 .intro-copy { max-width:18rem; margin:1.4rem 0 0; color:var(--muted); font-size:.9rem; line-height:1.6; }
    #arc-s02-001 .all-link, #arc-s02-001 .project-link { display:inline-flex; align-items:center; min-height:2.75rem; color:var(--ink); font-size:.72rem; font-weight:700; text-underline-offset:.25rem; }
    #arc-s02-001 .all-link { margin-top:1.2rem; padding:0 1rem; border:1px solid var(--line); text-decoration:none; }
    #arc-s02-001 .all-link::after { content:'↗'; margin-left:1rem; color:var(--accent); }
    #arc-s02-001 .mosaic { display:grid; grid-template-columns:1.35fr .72fr .72fr; grid-template-rows:1fr 1fr; gap:1rem; min-width:0; }
    #arc-s02-001 figure { min-width:0; margin:0; }
    #arc-s02-001 .project--lead { grid-row:1 / 3; }
    #arc-s02-001 .project--tall { grid-column:3; grid-row:1 / 3; }
    #arc-s02-001 .media { width:100%; min-height:0; aspect-ratio:4 / 3; border:1px solid var(--line); background:#dedbd3; }
    #arc-s02-001 .project--lead .media, #arc-s02-001 .project--tall .media { height:calc(100% - 5.4rem); min-height:23rem; aspect-ratio:auto; }
    #arc-s02-001 figcaption { display:grid; grid-template-columns:1fr auto; gap:.8rem; padding-top:.65rem; }
    #arc-s02-001 h2 { margin:0; font-family:Georgia,'Times New Roman',serif; font-size:clamp(1rem,1.5vw,1.45rem); font-weight:400; }
    #arc-s02-001 .meta { margin:.25rem 0 0; color:var(--muted); font-size:.6rem; font-weight:700; letter-spacing:.1em; line-height:1.45; text-transform:uppercase; }
    #arc-s02-001 .project-link { align-self:start; justify-content:center; min-width:2.75rem; font-size:.95rem; text-decoration:none; }
    #arc-s02-001 a:hover { color:var(--accent); }
    #arc-s02-001 a:focus-visible { outline:3px solid var(--accent); outline-offset:4px; }
    @media (max-width:68rem) {
      #arc-s02-001 .layout { grid-template-columns:1fr; }
      #arc-s02-001 .intro { display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; align-items:end; }
      #arc-s02-001 .intro-copy { margin-top:0; }
    }
    @media (max-width:48rem) {
      #arc-s02-001 .mosaic { grid-template-columns:1fr 1fr; grid-template-rows:auto; }
      #arc-s02-001 .project--lead, #arc-s02-001 .project--tall { grid-column:auto; grid-row:auto; }
      #arc-s02-001 .project--lead { grid-column:1 / -1; }
      #arc-s02-001 .project--lead .media, #arc-s02-001 .project--tall .media { height:auto; min-height:0; aspect-ratio:16 / 10; }
    }
    @media (max-width:32rem) {
      #arc-s02-001 { padding-inline:.8rem; }
      #arc-s02-001 .intro { grid-template-columns:1fr; }
      #arc-s02-001 .intro-copy { margin-top:.5rem; }
      #arc-s02-001 .mosaic { grid-template-columns:1fr; }
      #arc-s02-001 .project--lead { grid-column:auto; }
      #arc-s02-001 .media, #arc-s02-001 .project--lead .media, #arc-s02-001 .project--tall .media { aspect-ratio:4 / 3; }
    }
    @media (prefers-reduced-motion:reduce) { #arc-s02-001 * { scroll-behavior:auto !important; } }
  </style>
</head>
<body>
  <main id="arc-s02-001" data-study-id="ARC-S02-001">
    <section class="layout" aria-labelledby="arc-s02-001-title">
      <header class="intro">
        <div><p class="eyebrow">Featured projects</p><h1 id="arc-s02-001-title">Spaces that define place</h1></div>
        <div><p class="intro-copy">A concise studio selection spanning residential architecture, interior work and adaptive reuse.</p><a class="all-link" href="#project-grid">View all projects</a></div>
      </header>
      <div class="mosaic" id="project-grid">
        <figure class="project--lead" id="mosaic-courtyard-house"><div class="media" role="img" aria-label="Empty image slot for Courtyard House"></div><figcaption><div><h2>Courtyard House</h2><p class="meta">Residential architecture</p></div><a class="project-link" href="#mosaic-courtyard-house" aria-label="Explore Courtyard House">↗</a></figcaption></figure>
        <figure id="mosaic-garden-studio"><div class="media" role="img" aria-label="Empty image slot for Garden Studio"></div><figcaption><div><h2>Garden Studio</h2><p class="meta">Adaptive reuse</p></div><a class="project-link" href="#mosaic-garden-studio" aria-label="Explore Garden Studio">↗</a></figcaption></figure>
        <figure id="mosaic-civic-interior"><div class="media" role="img" aria-label="Empty image slot for Civic Interior"></div><figcaption><div><h2>Civic Interior</h2><p class="meta">Interior architecture</p></div><a class="project-link" href="#mosaic-civic-interior" aria-label="Explore Civic Interior">↗</a></figcaption></figure>
        <figure class="project--tall" id="mosaic-ridge-residence"><div class="media" role="img" aria-label="Empty image slot for Ridge Residence"></div><figcaption><div><h2>Ridge Residence</h2><p class="meta">Residential architecture</p></div><a class="project-link" href="#mosaic-ridge-residence" aria-label="Explore Ridge Residence">↗</a></figcaption></figure>
      </div>
    </section>
  </main>
