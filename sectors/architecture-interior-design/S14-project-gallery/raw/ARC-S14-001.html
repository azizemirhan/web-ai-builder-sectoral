<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!--
  WebAIBuilder — Sector Design Authoring Workspace
  Raw study. Standalone HTML. Scoped CSS. No framework, CDN, or remote runtime dependency.

  Study ID       : ARC-S14-001
  Sector         : Architecture & Interior Design (ARC)
  Section        : ARC-S14 — Project Gallery
  Territory      : Universal / Safe
  Layout model   : Heading block over an eight-cell grid at four span sizes, each cell captioned
  Density        : Medium
  Media mode     : Eight empty image areas at four different spans. This is the section where
                   media IS the content, so every study here is mostly slot.
  Interaction    : None (static; no JavaScript)
  Section note   : S14 is image-led. S02 indexes projects with metadata and S13 features one
                   project in depth; this section shows the work itself and captions it.
  Content note   : Captions name a placeholder project record and a view, never a client,
                   address, date or completed project.
-->

<meta name="study-id" content="ARC-S14-001">
<meta name="sector" content="Architecture &amp; Interior Design">
<meta name="sector-prefix" content="ARC">
<meta name="section-id" content="ARC-S14">
<meta name="section-name" content="Project Gallery">
<meta name="variant" content="001">
<meta name="territory" content="Universal / Safe">
<meta name="layout-model" content="Captioned gallery grid at four span sizes">
<meta name="density" content="medium">
<meta name="media-mode" content="empty-gallery-cells-mixed-spans">
<meta name="interaction" content="none">
<meta name="dependencies" content="none">
<meta name="batch" content="V1">

<title>ARC-S14-001 — Gallery, Universal / Safe</title>

<style>
/* Standalone host baseline */
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: #fbfbfa; }

/* Scoped study styles — namespaced to .arc-s14-001 */
.arc-s14-001 {
  --ink: #16171a;
  --ink-soft: #56585e;
  --paper: #fbfbfa;
  --slot: #e4e4e2;
  --slot-ink: #4b4d51;
  --line: #e2e2e0;
  --line-strong: #84868b;
  --focus: #1f4fd8;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

  box-sizing: border-box;
  background: var(--paper);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 1rem;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
.arc-s14-001 *,
.arc-s14-001 *::before,
.arc-s14-001 *::after { box-sizing: inherit; }
.arc-s14-001 :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

.arc-s14-001 .shell {
  width: 100%; max-width: 1320px; margin: 0 auto;
  padding: clamp(40px, 5vw, 78px) clamp(18px, 3vw, 44px);
}

/* --- Head ---------------------------------------------------------------------- */
.arc-s14-001 .head {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 20px; flex-wrap: wrap; margin-bottom: clamp(20px, 2.6vw, 34px);
}
.arc-s14-001 .eyebrow {
  margin: 0 0 12px; font-family: var(--mono);
  font-size: 0.5625rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-soft);
}
.arc-s14-001 h1 {
  margin: 0; font-size: clamp(1.625rem, 3vw, 2.375rem);
  line-height: 1.12; letter-spacing: -0.028em; font-weight: 500; max-width: 18ch;
}
.arc-s14-001 .head p { margin: 0; font-size: 0.8125rem; color: var(--ink-soft); max-width: 40ch; }

/* --- Gallery grid ----------------------------------------------------------------- */
.arc-s14-001 .gallery {
  display: grid; grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: clamp(12px, 1.6vw, 20px);
  margin: 0; padding: 0; list-style: none;
}
.arc-s14-001 .gallery > li { margin: 0; }
.arc-s14-001 figure { margin: 0; }
.arc-s14-001 .slot {
  display: flex; align-items: flex-end;
  background: var(--slot); border-radius: 4px;
}
.arc-s14-001 .slot p {
  margin: 0; padding: 11px 13px; font-family: var(--mono);
  font-size: 0.5rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--slot-ink);
}
.arc-s14-001 figcaption {
  margin-top: 9px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  font-size: 0.75rem; color: var(--ink-soft);
}
.arc-s14-001 figcaption b { color: var(--ink); font-weight: 500; }

/* Four span sizes so the wall has a rhythm rather than a repeat. */
.arc-s14-001 .w4 { grid-column: span 4; } .arc-s14-001 .w4 .slot { aspect-ratio: 16 / 9; }
.arc-s14-001 .w2 { grid-column: span 2; } .arc-s14-001 .w2 .slot { aspect-ratio: 3 / 4; }
.arc-s14-001 .w3 { grid-column: span 3; } .arc-s14-001 .w3 .slot { aspect-ratio: 4 / 3; }
.arc-s14-001 .w6 { grid-column: span 6; } .arc-s14-001 .w6 .slot { aspect-ratio: 21 / 9; }

.arc-s14-001 .foot {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; flex-wrap: wrap;
  margin-top: clamp(20px, 2.6vw, 32px); padding-top: clamp(14px, 1.8vw, 20px);
  border-top: 1px solid var(--line);
}
.arc-s14-001 .foot p { margin: 0; font-size: 0.75rem; color: var(--ink-soft); }
.arc-s14-001 .foot a {
  display: inline-flex; align-items: center; gap: 8px; min-height: 44px;
  font-size: 0.9375rem; color: var(--ink); text-decoration: none;
  border-bottom: 1px solid var(--line-strong);
}
.arc-s14-001 .foot a:hover,
.arc-s14-001 .foot a:focus-visible { border-bottom-color: var(--ink); }

/* --- Responsive -------------------------------------------------------------------- */
@media (max-width: 1280px) {
  .arc-s14-001 .gallery { gap: 14px; }
}
@media (max-width: 1024px) {
  .arc-s14-001 .gallery { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .arc-s14-001 .w4, .arc-s14-001 .w6 { grid-column: span 4; }
  .arc-s14-001 .w3 { grid-column: span 2; }
  .arc-s14-001 h1 { max-width: 22ch; }
}
@media (max-width: 768px) {
  .arc-s14-001 .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .arc-s14-001 .w4, .arc-s14-001 .w6 { grid-column: span 2; }
  .arc-s14-001 .w3, .arc-s14-001 .w2 { grid-column: span 1; }
  .arc-s14-001 .w6 .slot { aspect-ratio: 16 / 9; }
}
@media (max-width: 480px) {
  .arc-s14-001 .gallery { grid-template-columns: minmax(0, 1fr); }
  .arc-s14-001 .w4, .arc-s14-001 .w6, .arc-s14-001 .w3, .arc-s14-001 .w2 { grid-column: span 1; }
  .arc-s14-001 .w2 .slot { aspect-ratio: 4 / 3; }
  .arc-s14-001 .foot { align-items: flex-start; flex-direction: column; gap: 10px; }
}
@media (max-width: 360px) {
  .arc-s14-001 .slot p { padding: 10px 12px; }
}

@media (prefers-reduced-motion: reduce) {
  .arc-s14-001 *, .arc-s14-001 *::before, .arc-s14-001 *::after {
    animation-duration: 0.001ms !important; animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important; scroll-behavior: auto !important;
  }
}
</style>
</head>

<body>
<div class="arc-s14-001" data-study-id="ARC-S14-001" data-territory="universal-safe">

  <section class="shell" aria-labelledby="arc-s14-001-title">

    <div class="head">
      <div>
        <p class="eyebrow">Project gallery &#183; placeholder</p>
        <h1 id="arc-s14-001-title">The work, without the commentary</h1>
      </div>
      <p>Eight images across four sizes, each captioned with the record it belongs to.</p>
    </div>

    <ul class="gallery">
      <li class="w4">
        <figure>
          <div class="slot"><p>Image area &#183; 16:9</p></div>
          <figcaption><b>Project record 01</b><span>Exterior &#183; placeholder</span></figcaption>
        </figure>
      </li>
      <li class="w2">
        <figure>
          <div class="slot"><p>Image area &#183; 3:4</p></div>
          <figcaption><b>Project record 01</b><span>Detail</span></figcaption>
        </figure>
      </li>
      <li class="w3">
        <figure>
          <div class="slot"><p>Image area &#183; 4:3</p></div>
          <figcaption><b>Project record 02</b><span>Interior</span></figcaption>
        </figure>
      </li>
      <li class="w3">
        <figure>
          <div class="slot"><p>Image area &#183; 4:3</p></div>
          <figcaption><b>Project record 02</b><span>Interior</span></figcaption>
        </figure>
      </li>
      <li class="w6">
        <figure>
          <div class="slot"><p>Image area &#183; 21:9</p></div>
          <figcaption><b>Project record 03</b><span>Long view &#183; placeholder</span></figcaption>
        </figure>
      </li>
      <li class="w2">
        <figure>
          <div class="slot"><p>Image area &#183; 3:4</p></div>
          <figcaption><b>Project record 04</b><span>Stair</span></figcaption>
        </figure>
      </li>
      <li class="w2">
        <figure>
          <div class="slot"><p>Image area &#183; 3:4</p></div>
          <figcaption><b>Project record 04</b><span>Joinery</span></figcaption>
        </figure>
      </li>
      <li class="w2">
        <figure>
          <div class="slot"><p>Image area &#183; 3:4</p></div>
          <figcaption><b>Project record 05</b><span>Threshold</span></figcaption>
        </figure>
      </li>
    </ul>

    <div class="foot">
      <p>Placeholder gallery &#183; structure demonstration only. No completed project is implied.</p>
      <a href="#arc-s14-001-title">See all projects<span aria-hidden="true"> &#8594;</span></a>
    </div>

  </section>

</div>
</body>
</html>
