<!--
  WebAIBuilder — Sector Design Authoring Workspace
  Raw study. Standalone HTML. Scoped CSS. No framework, CDN, or remote runtime dependency.

  Study ID       : ARC-S04-005
  Sector         : Architecture & Interior Design (ARC)
  Section        : ARC-S04 — Project Typologies
  Territory      : Sector-native / Distinctive
  Reference      : Reference 2 — a numbered "02 / Catalog" label, a two-line heading with an
                   emphasised phrase on the left, a vertical category list at the top right with
                   one entry active and the rest fading back, a pair of image cards filling the
                   lower right, and a short paragraph with circular previous / next controls at
                   the bottom left.
  Layout model   : Numbered catalogue sheet — heading column, vertical category index, paired
                   plate viewport, and sheet navigation
  Density        : Medium
  Media mode     : Two empty plate areas per category, four categories, eight plate states total.
  Interaction    : Vanilla JavaScript, about seventy lines. WAI-ARIA vertical tabs with roving
                   tabindex and Arrow / Home / End keys, plus previous / next controls that step
                   the same selection, disable at each end, and hand focus to the opposite
                   control when the pressed one becomes disabled. Without JavaScript the first
                   category stays visible and every category name remains in the document.
  Content note   : The category index is a typology index, not a listings filter. All plate
                   captions are neutral placeholders; no client names, awards, certifications,
                   statistics, pricing, or completed-project claims.
-->

<meta name="sector" content="Architecture &amp; Interior Design">
<meta name="sector-prefix" content="ARC">
<meta name="section-id" content="ARC-S04">
<meta name="section-name" content="Project Typologies">
<meta name="variant" content="005">
<meta name="territory" content="Sector-native / Distinctive">

<meta name="density" content="medium">

<title>ARC-S04-005 — Typologies, Sector-native / Distinctive</title>

<style>
/* Standalone host baseline */
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: #c9c9c4; }

/* Scoped study styles — namespaced to .arc-s04-005 */
.arc-s04-005 {
  --ground: #c9c9c4;
  --ink: #14161a;
  --ink-soft: #3f413d;
  --ink-fade: #6d6f6a;
  --tab-idle: #4f5149;
  --plate: #b9b9b3;
  --plate-ink: #33352f;
  --hair: #a5a59f;
  --hair-ink: #6a6c66;
  --focus: #1f4fd8;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

  box-sizing: border-box;
  background: var(--ground);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 1rem;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
.arc-s04-005 *,
.arc-s04-005 *::before,
.arc-s04-005 *::after { box-sizing: inherit; }
.arc-s04-005 :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

.arc-s04-005 .shell {
  width: 100%; max-width: 1320px; margin: 0 auto;
  padding: clamp(36px, 4.6vw, 72px) clamp(16px, 2.8vw, 44px);
}

/* --- Sheet number ---------------------------------------------- */
.arc-s04-005 .sheetno {
  margin: 0 0 clamp(20px, 2.6vw, 34px);
  font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.08em; color: var(--ink-soft);
}

/* --- Grid ------------------------------------------------------- */
.arc-s04-005 .grid {
  display: grid; grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.9fr);
  gap: clamp(24px, 3vw, 52px);
  align-items: start;
}
.arc-s04-005 .col-left { display: flex; flex-direction: column; height: 100%; }
.arc-s04-005 h1 {
  margin: 0 0 clamp(28px, 4vw, 64px);
  font-size: clamp(1.5rem, 2.9vw, 2.375rem);
  line-height: 1.16; letter-spacing: -0.024em; font-weight: 400; max-width: 18ch;
}
.arc-s04-005 h1 b { font-weight: 700; }
.arc-s04-005 .col-left > p {
  margin: auto 0 clamp(18px, 2.2vw, 28px);
  font-size: 0.875rem; color: var(--ink-soft); max-width: 42ch;
}

/* --- Sheet navigation ------------------------------------------ */
.arc-s04-005 .nav { display: flex; gap: 10px; }
.arc-s04-005 .nav button {
  display: inline-flex; align-items: center; justify-content: center;
  width: 46px; height: 46px; border-radius: 999px;
  background: transparent; color: var(--ink);
  border: 1px solid var(--hair-ink); cursor: pointer;
  font-size: 0.9375rem; line-height: 1;
  transition: background-color 150ms ease, border-color 150ms ease;
}
.arc-s04-005 .nav button:hover:not(:disabled),
.arc-s04-005 .nav button:focus-visible { background: #bfbfba; border-color: var(--ink); }
.arc-s04-005 .nav button:disabled { color: var(--ink-fade); border-color: var(--hair); cursor: default; }

/* --- Category index (tabs) ------------------------------------- */
.arc-s04-005 .index { margin: 0 0 clamp(20px, 2.6vw, 34px); }
.arc-s04-005 .index h2 {
  margin: 0 0 10px; font-family: var(--mono);
  font-size: 0.625rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-soft);
  text-align: right;
}
.arc-s04-005 [role="tablist"] { display: flex; flex-direction: column; align-items: flex-end; }
.arc-s04-005 [role="tab"] {
  display: inline-flex; align-items: baseline; gap: 10px;
  padding: 7px 0; border: 0; background: transparent;
  font: inherit; font-size: clamp(0.9375rem, 1.3vw, 1.0625rem);
  color: var(--tab-idle); cursor: pointer; text-align: right;
  transition: color 140ms ease;
}
.arc-s04-005 [role="tab"]:hover { color: var(--ink); }
.arc-s04-005 [role="tab"] .caret { visibility: hidden; font-size: 0.75rem; color: var(--ink); }
.arc-s04-005 [role="tab"][aria-selected="true"] { color: var(--ink); font-weight: 700; }
.arc-s04-005 [role="tab"][aria-selected="true"] .caret { visibility: visible; }
.arc-s04-005 [role="tab"][aria-selected="true"] .name {
  border-bottom: 1px solid var(--ink); padding-bottom: 2px;
}

/* --- Plate pair ------------------------------------------------- */
.arc-s04-005 [role="tabpanel"] { margin: 0; }
.arc-s04-005 [role="tabpanel"][hidden] { display: none; }
.arc-s04-005 .plates { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(12px, 1.6vw, 22px); }
.arc-s04-005 .plates figure { margin: 0; }
.arc-s04-005 .plate {
  display: flex; align-items: flex-end;
  aspect-ratio: 4 / 3; background: var(--plate); border-radius: 4px;
}
.arc-s04-005 .plate p {
  margin: 0; padding: 12px 14px; font-family: var(--mono);
  font-size: 0.5625rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--plate-ink);
}
.arc-s04-005 .plates figcaption {
  margin-top: 10px; font-family: var(--mono);
  font-size: 0.625rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft);
}

/* --- Responsive -------------------------------------------------- */
@media (max-width: 1280px) {
  .arc-s04-005 .grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1.7fr); }
}
@media (max-width: 1024px) {
  .arc-s04-005 .grid { grid-template-columns: minmax(0, 1fr); gap: 28px; }
  .arc-s04-005 .col-left > p { margin-top: 0; }
  .arc-s04-005 .index h2 { text-align: left; }
  .arc-s04-005 [role="tablist"] { flex-direction: row; flex-wrap: wrap; gap: 6px 24px; align-items: baseline; }
  .arc-s04-005 [role="tab"] { text-align: left; }
  .arc-s04-005 h1 { max-width: 24ch; margin-bottom: 22px; }
}
@media (max-width: 768px) {
  .arc-s04-005 .plate { aspect-ratio: 3 / 2; }
}
@media (max-width: 480px) {
  .arc-s04-005 .plates { grid-template-columns: minmax(0, 1fr); }
  .arc-s04-005 .plate { aspect-ratio: 4 / 3; }
  .arc-s04-005 [role="tablist"] { gap: 4px 18px; }
  .arc-s04-005 .col-left > p { max-width: none; }
}
@media (max-width: 360px) {
  .arc-s04-005 .nav button { width: 44px; height: 44px; }
  .arc-s04-005 [role="tab"] { font-size: 0.9375rem; }
}

@media (prefers-reduced-motion: reduce) {
  .arc-s04-005 *, .arc-s04-005 *::before, .arc-s04-005 *::after {
    animation-duration: 0.001ms !important; animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important; scroll-behavior: auto !important;
  }
}
</style>

<body>
<div class="arc-s04-005" data-study-id="ARC-S04-005" data-territory="sector-native-distinctive">

  <section class="shell" aria-labelledby="arc-s04-005-title">

    <p class="sheetno">04 / Typology catalogue</p>

    <div class="grid">

      <div class="col-left">
        <h1 id="arc-s04-005-title">A plan that fits <b>the way it will be used</b></h1>

        <p>
          The catalogue is organised by typology rather than by date. Each entry holds
          the plates the studio keeps for that kind of project — plan, section, and the
          details that repeat across it.
        </p>

        <div class="nav">
          <button type="button" id="arc-s04-005-prev" aria-label="Previous typology">
            <span aria-hidden="true">&#8592;</span>
          </button>
          <button type="button" id="arc-s04-005-next" aria-label="Next typology">
            <span aria-hidden="true">&#8594;</span>
          </button>
        </div>
      </div>

      <div class="col-right">

        <div class="index">
          <h2 id="arc-s04-005-index">Typology index</h2>
          <div role="tablist" aria-labelledby="arc-s04-005-index" aria-orientation="vertical">
            <button role="tab" type="button" id="arc-s04-005-tab-1"
                    aria-controls="arc-s04-005-panel-1" aria-selected="true" tabindex="0">
              <span class="caret" aria-hidden="true">&#9656;</span><span class="name">Residential</span>
            </button>
            <button role="tab" type="button" id="arc-s04-005-tab-2"
                    aria-controls="arc-s04-005-panel-2" aria-selected="false" tabindex="-1">
              <span class="caret" aria-hidden="true">&#9656;</span><span class="name">Workplace</span>
            </button>
            <button role="tab" type="button" id="arc-s04-005-tab-3"
                    aria-controls="arc-s04-005-panel-3" aria-selected="false" tabindex="-1">
              <span class="caret" aria-hidden="true">&#9656;</span><span class="name">Cultural &amp; civic</span>
            </button>
            <button role="tab" type="button" id="arc-s04-005-tab-4"
                    aria-controls="arc-s04-005-panel-4" aria-selected="false" tabindex="-1">
              <span class="caret" aria-hidden="true">&#9656;</span><span class="name">Adaptive reuse</span>
            </button>
          </div>
        </div>

        <div role="tabpanel" id="arc-s04-005-panel-1" aria-labelledby="arc-s04-005-tab-1" tabindex="0">
          <div class="plates">
            <figure>
              <div class="plate"><p>Plate area &#183; R-01</p></div>
              <figcaption>Residential &#183; plan</figcaption>
            </figure>
            <figure>
              <div class="plate"><p>Plate area &#183; R-02</p></div>
              <figcaption>Residential &#183; section</figcaption>
            </figure>
          </div>
        </div>

        <div role="tabpanel" id="arc-s04-005-panel-2" aria-labelledby="arc-s04-005-tab-2" tabindex="0" hidden>
          <div class="plates">
            <figure>
              <div class="plate"><p>Plate area &#183; W-01</p></div>
              <figcaption>Workplace &#183; plan</figcaption>
            </figure>
            <figure>
              <div class="plate"><p>Plate area &#183; W-02</p></div>
              <figcaption>Workplace &#183; interior</figcaption>
            </figure>
          </div>
        </div>

        <div role="tabpanel" id="arc-s04-005-panel-3" aria-labelledby="arc-s04-005-tab-3" tabindex="0" hidden>
          <div class="plates">
            <figure>
              <div class="plate"><p>Plate area &#183; C-01</p></div>
              <figcaption>Cultural &#183; plan</figcaption>
            </figure>
            <figure>
              <div class="plate"><p>Plate area &#183; C-02</p></div>
              <figcaption>Cultural &#183; section</figcaption>
            </figure>
          </div>
        </div>

        <div role="tabpanel" id="arc-s04-005-panel-4" aria-labelledby="arc-s04-005-tab-4" tabindex="0" hidden>
          <div class="plates">
            <figure>
              <div class="plate"><p>Plate area &#183; A-01</p></div>
              <figcaption>Adaptive reuse &#183; survey</figcaption>
            </figure>
            <figure>
              <div class="plate"><p>Plate area &#183; A-02</p></div>
              <figcaption>Adaptive reuse &#183; detail</figcaption>
            </figure>
          </div>
        </div>

      </div>
    </div>
  </section>

</div>

<script>
(function () {
  var root = document.querySelector('.arc-s04-005');
  if (!root) return;

  var list = root.querySelector('[role="tablist"]');
  var prev = root.querySelector('#arc-s04-005-prev');
  var next = root.querySelector('#arc-s04-005-next');
  if (!list || !prev || !next) return;

  var tabs = Array.prototype.slice.call(list.querySelectorAll('[role="tab"]'));
  if (tabs.length === 0) return;

  var current = 0;

  function select(index, moveFocus) {
    current = index;
    tabs.forEach(function (tab, i) {
      var selected = i === index;
      var panel = root.querySelector('#' + tab.getAttribute('aria-controls'));
      tab.setAttribute('aria-selected', selected ? 'true' : 'false');
      tab.tabIndex = selected ? 0 : -1;
      if (panel) panel.hidden = !selected;
    });
    prev.disabled = index === 0;
    next.disabled = index === tabs.length - 1;
    if (moveFocus) tabs[index].focus();
  }

  tabs.forEach(function (tab, i) {
    tab.addEventListener('click', function () { select(i, false); });
  });

  list.addEventListener('keydown', function (event) {
    var from = tabs.indexOf(document.activeElement);
    if (from === -1) return;

    var to = null;
    switch (event.key) {
      case 'ArrowDown':
      case 'ArrowRight': to = (from + 1) % tabs.length; break;
      case 'ArrowUp':
      case 'ArrowLeft':  to = (from - 1 + tabs.length) % tabs.length; break;
      case 'Home':       to = 0; break;
      case 'End':        to = tabs.length - 1; break;
      default: return;
    }
    event.preventDefault();
    select(to, true);
  });

  function step(delta, source) {
    var to = current + delta;
    if (to < 0 || to > tabs.length - 1) return;
    select(to, false);
    // A control that disables itself must not strand focus.
    if (source.disabled) (source === prev ? next : prev).focus();
  }

  prev.addEventListener('click', function () { step(-1, prev); });
  next.addEventListener('click', function () { step(1, next); });

  select(0, false);
})();
</script>
</body>
