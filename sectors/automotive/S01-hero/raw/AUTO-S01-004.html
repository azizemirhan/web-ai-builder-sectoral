<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!--
  WebAIBuilder — Sector Design Authoring Workspace
  Raw study. Standalone HTML. Scoped CSS. No framework, CDN, or remote runtime dependency.

  Study ID       : AUTO-S01-004
  Sector         : Automotive (AUTO)
  Section        : AUTO-S01 — Hero
  Direction      : Conversion-led
  Reference      : Supplied visual research — reference 1 of five images provided with the
                   authoring request (a lifestyle vehicle frame with a heavy headline, a
                   high-visibility primary action and a secondary play action). Its action
                   hierarchy is the part that was used. Its rental-specific content model is
                   not reproduced, and none of its brand, wording, vehicle or photograph
                   appears here.
  Layout model   : Full-bleed dark stage with the copy held low-left, and a solid full-width
                   action band on the bottom edge carrying the primary action, one secondary
                   action and one short supporting line
  Density        : Low-medium
  Media mode     : One reserved full-bleed media area with a two-axis scrim, so the overlay
                   copy keeps contrast independently of the eventual photograph. The slot tone
                   is set deliberately lighter than the stage so the reserved region still
                   reads as a reserved region while it is empty.
  Interaction    : None (static; no JavaScript). Conversion is expressed as a visible action
                   hierarchy, not as a form — the study captures no data.
  Content note   : One conversion intent only: book a test drive. No prices, monthly payments,
                   finance or lease terms, discounts, countdowns, scarcity or availability
                   claims, and no performance or range figures. The media area is reserved
                   and intentionally empty.
-->

<meta name="study-id" content="AUTO-S01-004">
<meta name="sector" content="Automotive">
<meta name="sector-prefix" content="AUTO">
<meta name="section-id" content="AUTO-S01">
<meta name="section-name" content="Hero">
<meta name="variant" content="004">
<meta name="territory" content="Conversion-led">
<meta name="direction" content="Conversion-led">
<meta name="layout-model" content="Full-bleed dark stage with low-left copy and a solid full-width action band on the bottom edge">
<meta name="density" content="low-medium">
<meta name="media-mode" content="reserved-full-bleed-media-area-with-scrim">
<meta name="interaction" content="none">
<meta name="dependencies" content="none">
<meta name="batch" content="V1">

<title>AUTO-S01-004 — Hero, Conversion-led</title>

<style>
/* Standalone host baseline */
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: #0e0f11; }

/* Scoped study styles — namespaced to .auto-s01-004 */
.auto-s01-004 {
  --ink: #f4f5f7;
  --ink-soft: #b6bac1;
  --stage: #0e0f11;
  --band: #17181b;
  --band-line: #2f3238;
  --slot: #2b2d32;
  --slot-ink: #9ea3ab;
  --accent: #f5b81c;
  --accent-hover: #ffc93b;
  --accent-ink: #17150c;
  --focus: #f5b81c;

  box-sizing: border-box;
  display: block;
  background: var(--stage);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 1rem;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
.auto-s01-004 *,
.auto-s01-004 *::before,
.auto-s01-004 *::after { box-sizing: inherit; }
.auto-s01-004 :focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 3px;
  border-radius: 4px;
}

/* Stage */
.auto-s01-004 .stage {
  position: relative;
  display: flex;
  flex-direction: column;
  min-height: clamp(600px, 88vh, 860px);
  overflow: hidden;
}

.auto-s01-004 .media {
  position: absolute;
  inset: 0;
  background: var(--slot);
}
.auto-s01-004 .media::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(90deg, rgba(10, 11, 13, 0.9) 0%, rgba(10, 11, 13, 0.62) 42%, rgba(10, 11, 13, 0.12) 78%),
    linear-gradient(180deg, rgba(10, 11, 13, 0.45) 0%, rgba(10, 11, 13, 0.1) 34%, rgba(10, 11, 13, 0.78) 100%);
}
.auto-s01-004 .slot-label {
  position: absolute;
  top: clamp(18px, 2.4vw, 30px);
  right: clamp(20px, 3.6vw, 52px);
  font-size: 0.71rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--slot-ink);
}

/* Copy field, held low-left */
.auto-s01-004 .shell {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 1440px;
  margin: 0 auto;
  padding: clamp(56px, 7vw, 104px) clamp(20px, 3.6vw, 52px) clamp(34px, 4vw, 54px);
  flex: 1 1 auto;
  display: flex;
  align-items: flex-end;
}
.auto-s01-004 .copy { max-width: min(820px, 66%); min-width: 0; }

.auto-s01-004 .eyebrow {
  margin: 0 0 clamp(14px, 1.8vw, 22px);
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: 0.73rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--accent);
}
.auto-s01-004 .eyebrow::before {
  content: "";
  width: 26px;
  height: 2px;
  background: var(--accent);
}

.auto-s01-004 h1 {
  margin: 0;
  font-size: clamp(2.3rem, 5.4vw, 4.5rem);
  line-height: 1.0;
  letter-spacing: -0.03em;
  font-weight: 700;
  text-transform: uppercase;
}
.auto-s01-004 h1 .line { display: block; }

.auto-s01-004 .lead {
  margin: clamp(20px, 2.4vw, 30px) 0 0;
  max-width: 36ch;
  color: var(--ink-soft);
  font-size: clamp(1rem, 1.05vw, 1.1rem);
}

/* Action band on the bottom edge */
.auto-s01-004 .actionbar {
  position: relative;
  z-index: 2;
  flex: 0 0 auto;
  background: var(--band);
  border-top: 1px solid var(--band-line);
}
.auto-s01-004 .actionbar-inner {
  width: 100%;
  max-width: 1440px;
  margin: 0 auto;
  padding: clamp(18px, 2vw, 26px) clamp(20px, 3.6vw, 52px);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: clamp(16px, 2vw, 30px);
}

.auto-s01-004 .btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  min-height: 56px;
  padding: 0 34px;
  border-radius: 999px;
  background: var(--accent);
  color: var(--accent-ink);
  font-size: 1rem;
  font-weight: 700;
  text-decoration: none;
  transition: background-color 140ms ease;
}
.auto-s01-004 .btn:hover { background: var(--accent-hover); }
.auto-s01-004 .btn .arrow { font-size: 1.1em; line-height: 1; }

.auto-s01-004 .play {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  min-height: 48px;
  color: var(--ink);
  font-size: 0.95rem;
  font-weight: 600;
  text-decoration: none;
}
.auto-s01-004 .play-disc {
  width: 40px;
  height: 40px;
  flex: 0 0 auto;
  border-radius: 50%;
  border: 1px solid #7e848d;
  display: grid;
  place-items: center;
  transition: border-color 140ms ease, background-color 140ms ease;
}
.auto-s01-004 .play-disc svg { display: block; }
.auto-s01-004 .play:hover .play-disc { border-color: var(--ink); background: rgba(255, 255, 255, 0.08); }
.auto-s01-004 .play span:last-child {
  text-decoration: underline;
  text-underline-offset: 5px;
  text-decoration-thickness: 1px;
}

.auto-s01-004 .band-note {
  margin: 0;
  margin-left: auto;
  max-width: 30ch;
  color: var(--ink-soft);
  font-size: 0.85rem;
  line-height: 1.5;
}

/* Responsive ladder */
@media (max-width: 1024px) {
  .auto-s01-004 .copy { max-width: min(700px, 80%); }
  .auto-s01-004 .band-note { margin-left: 0; flex-basis: 100%; max-width: none; }
}

@media (max-width: 768px) {
  .auto-s01-004 .stage { min-height: 0; }
  .auto-s01-004 .shell {
    padding-top: clamp(72px, 16vw, 120px);
    padding-bottom: clamp(40px, 8vw, 60px);
  }
  .auto-s01-004 .copy { max-width: none; }
  .auto-s01-004 .lead { max-width: 40ch; }
  /* The horizontal scrim layer is dropped with the two-column proportion, so the vertical
     layer alone has to protect the copy band against a bright photograph. */
  .auto-s01-004 .media::after {
    background:
      linear-gradient(180deg,
        rgba(10, 11, 13, 0.60) 0%,
        rgba(10, 11, 13, 0.78) 18%,
        rgba(10, 11, 13, 0.90) 50%,
        rgba(10, 11, 13, 0.95) 100%);
  }
}

@media (max-width: 480px) {
  .auto-s01-004 .actionbar-inner { gap: 16px; }
  .auto-s01-004 .btn { width: 100%; padding: 0 22px; }
  .auto-s01-004 .lead { max-width: none; }
  .auto-s01-004 .slot-label { letter-spacing: 0.12em; }
}

@media (prefers-reduced-motion: reduce) {
  .auto-s01-004 * { transition: none !important; }
}
</style>
</head>
<body>

<main class="auto-s01-004" data-study-id="AUTO-S01-004" data-direction="Conversion-led">
  <section class="stage" aria-labelledby="auto-s01-004-title">

    <div class="media">
      <span class="slot-label">Lifestyle media</span>
    </div>

    <div class="shell">
      <div class="copy">
        <p class="eyebrow">Test drive</p>
        <h1 id="auto-s01-004-title">
          <span class="line">Drive it</span>
          <span class="line">before you decide</span>
        </h1>
        <p class="lead">Book an hour with the car on roads you already know, with someone from the team alongside you.</p>
      </div>
    </div>

    <div class="actionbar">
      <div class="actionbar-inner">
        <a class="btn" href="#auto-s01-004-title">
          Book a test drive
          <span class="arrow" aria-hidden="true">&rarr;</span>
        </a>
        <a class="play" href="#auto-s01-004-title">
          <span class="play-disc" aria-hidden="true">
            <svg width="12" height="14" viewBox="0 0 12 14" focusable="false" aria-hidden="true">
              <path d="M1 1.2 11 7 1 12.8Z" fill="currentColor"></path>
            </svg>
          </span>
          <span>Watch the film</span>
        </a>
        <p class="band-note">Pick a day and a time that suits you, at the showroom closest to you.</p>
      </div>
    </div>

  </section>
</main>

</body>
</html>
