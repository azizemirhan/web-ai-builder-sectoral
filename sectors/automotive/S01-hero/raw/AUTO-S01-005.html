<!--
  WebAIBuilder — Sector Design Authoring Workspace
  Raw study. Standalone HTML. Scoped CSS. No framework, CDN, or remote runtime dependency.

  Study ID       : AUTO-S01-005
  Sector         : Automotive (AUTO)
  Section        : AUTO-S01 — Hero
  Direction      : Art-directed / Distinctive
  Reference      : Supplied visual research — reference 5 of five images provided with the
                   authoring request (a dark composition with a dramatic vehicle crop, a
                   floating detail card and an oversized typographic layer running along the
                   bottom edge). Its layering logic was translated, not its arrangement: no
                   brand, wordmark, wording, vehicle or photograph from that image appears
                   here. The oversized bottom layer is a word from this study's own
                   statement, not an invented marque.
  Layout model   : Layered dark stage — copy block top-left, dominant vehicle media field
                   right, one floating detail card over the media, and an oversized
                   typographic layer along the bottom edge that the media crops into
  Density        : Low (deliberately the smallest visible copy count of the five)
  Media mode     : Two reserved media areas — one dominant vehicle field and one small
                   detail field inside the floating card.
  Interaction    : None (static; no JavaScript)
  Content note   : Neutral placeholder copy. No model names, prices, finance terms, power,
                   acceleration, range or battery figures, no awards or certifications. The
                   media areas are reserved and intentionally empty; the composition is
                   legible in that state at every width.
-->

<meta name="study-id" content="AUTO-S01-005">
<meta name="sector" content="Automotive">
<meta name="sector-prefix" content="AUTO">
<meta name="section-id" content="AUTO-S01">
<meta name="section-name" content="Hero">
<meta name="variant" content="005">
<meta name="territory" content="Art-directed / Distinctive">
<meta name="direction" content="Art-directed / Distinctive">
<meta name="layout-model" content="Layered dark stage with floating detail card and an oversized bottom typographic layer">
<meta name="density" content="low">
<meta name="media-mode" content="reserved-dominant-vehicle-field-plus-detail-field-in-floating-card">
<meta name="interaction" content="none">
<meta name="dependencies" content="none">
<meta name="batch" content="V1">

<title>AUTO-S01-005 — Hero, Art-directed / Distinctive</title>

<style>
/* Standalone host baseline */
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: #0a0a0c; }

/* Scoped study styles — namespaced to .auto-s01-005 */
.auto-s01-005 {
  --ink: #f3f4f6;
  --ink-soft: #b9bcc2;
  --stage: #0a0a0c;
  --slot: #1b1c1f;
  --slot-ink: #9ea3ab;
  --card: #16171a;
  --card-line: #303339;
  --accent: #ff4a32;
  --accent-hover: #ff6650;
  --accent-ink: #12100f;
  --focus: #ff6650;

  box-sizing: border-box;
  display: block;
  background: var(--stage);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 1rem;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
.auto-s01-005 *,
.auto-s01-005 *::before,
.auto-s01-005 *::after { box-sizing: inherit; }
.auto-s01-005 :focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 3px;
  border-radius: 4px;
}

/* Stage */
.auto-s01-005 .stage {
  overflow: hidden;
  padding: clamp(44px, 5.4vw, 84px) clamp(20px, 3.6vw, 52px) 0;
}
.auto-s01-005 .frame {
  width: 100%;
  max-width: 1440px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.5fr);
  column-gap: clamp(24px, 3vw, 56px);
}

/* Layer 1 — copy, top left */
.auto-s01-005 .copy {
  grid-column: 1;
  grid-row: 1;
  align-self: start;
  position: relative;
  z-index: 2;
  min-width: 0;
  padding-top: clamp(4px, 1.4vw, 24px);
}
.auto-s01-005 .eyebrow {
  margin: 0 0 clamp(18px, 2.2vw, 30px);
  font-size: 0.72rem;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.auto-s01-005 h1 {
  margin: 0;
  font-size: clamp(2.1rem, 4.3vw, 3.6rem);
  line-height: 1.02;
  letter-spacing: -0.03em;
  font-weight: 620;
}
.auto-s01-005 h1 .line { display: block; }
.auto-s01-005 h1 .line--accent { color: var(--accent); }

.auto-s01-005 .btn {
  margin-top: clamp(26px, 3vw, 40px);
  display: inline-flex;
  align-items: center;
  gap: 12px;
  min-height: 52px;
  padding: 0 28px;
  border-radius: 999px;
  background: var(--accent);
  color: var(--accent-ink);
  font-size: 0.96rem;
  font-weight: 650;
  text-decoration: none;
  transition: background-color 140ms ease;
}
.auto-s01-005 .btn:hover { background: var(--accent-hover); }

/* Layer 2 — dominant vehicle media */
.auto-s01-005 .stack {
  grid-column: 2;
  grid-row: 1;
  position: relative;
  z-index: 1;
  min-width: 0;
}
.auto-s01-005 .media {
  min-height: clamp(320px, 36vw, 480px);
  border-radius: 20px;
  background: var(--slot);
  display: grid;
  place-items: center;
  padding: 24px;
}
.auto-s01-005 .slot-label {
  font-size: 0.71rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--slot-ink);
  text-align: center;
}

/* Layer 3 — floating detail card over the media */
.auto-s01-005 .card {
  position: absolute;
  z-index: 3;
  top: clamp(14px, 1.8vw, 26px);
  right: clamp(14px, 1.8vw, 26px);
  width: min(272px, 48%);
  padding: clamp(14px, 1.4vw, 18px);
  border-radius: 16px;
  background: var(--card);
  border: 1px solid var(--card-line);
}
.auto-s01-005 .card-media {
  aspect-ratio: 16 / 10;
  border-radius: 10px;
  background: var(--slot);
  display: grid;
  place-items: center;
  padding: 10px;
  margin-bottom: 14px;
}
.auto-s01-005 .card-body { min-width: 0; }
.auto-s01-005 .card h2 {
  margin: 0 0 6px;
  font-size: 1rem;
  line-height: 1.25;
  letter-spacing: -0.01em;
  font-weight: 620;
}
.auto-s01-005 .card p {
  margin: 0 0 14px;
  color: var(--ink-soft);
  font-size: 0.88rem;
  line-height: 1.5;
}
.auto-s01-005 .card-link {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 44px;
  color: var(--ink);
  font-size: 0.85rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  text-decoration: none;
}
.auto-s01-005 .card-link .label {
  text-decoration: underline;
  text-underline-offset: 5px;
  text-decoration-thickness: 1px;
}
.auto-s01-005 .disc {
  width: 36px;
  height: 36px;
  flex: 0 0 auto;
  border-radius: 50%;
  border: 1px solid #7e848d;
  display: grid;
  place-items: center;
  transition: border-color 140ms ease, background-color 140ms ease;
}
.auto-s01-005 .card-link:hover .disc { border-color: var(--ink); background: rgba(255, 255, 255, 0.08); }
.auto-s01-005 .disc svg { display: block; }

/* Layer 4 — oversized typographic layer, cropped by the media above it */
.auto-s01-005 .word {
  grid-column: 1 / -1;
  grid-row: 2;
  position: relative;
  z-index: 0;
  margin: clamp(-104px, -8vw, -30px) 0 clamp(-36px, -3.4vw, -10px);
  font-size: clamp(3.4rem, 19vw, 17rem);
  line-height: 0.78;
  letter-spacing: -0.05em;
  font-weight: 700;
  text-align: center;
  white-space: nowrap;
  color: var(--ink);
}

/* Responsive ladder — the layering simplifies deliberately */
@media (max-width: 1024px) {
  .auto-s01-005 .frame { grid-template-columns: minmax(0, 1fr); row-gap: clamp(26px, 4vw, 40px); }
  .auto-s01-005 .copy { grid-column: 1; grid-row: 1; padding-top: 0; }
  .auto-s01-005 .stack {
    grid-column: 1;
    grid-row: 2;
    display: grid;
    gap: 16px;
  }
  .auto-s01-005 .media { min-height: 0; aspect-ratio: 16 / 9; }
  /* The card stays overlaid here — the media field is still wide enough to hold it. */
  /* The pull has to clear the row gap as well, or the media stops cropping into the word. */
  .auto-s01-005 .word {
    grid-column: 1;
    grid-row: 3;
    margin: clamp(-120px, -11vw, -40px) 0 clamp(-22px, -2.4vw, -8px);
  }
}

/* Below this width the media can no longer hold the overlaid card, so the card leaves the
   overlay and becomes a compact horizontal module. Its detail media slot is kept — only its
   proportion changes. */
@media (max-width: 680px) {
  .auto-s01-005 .media { border-radius: 16px; }
  .auto-s01-005 .card {
    position: static;
    width: auto;
    max-width: none;
    display: grid;
    grid-template-columns: minmax(0, 104px) minmax(0, 1fr);
    gap: clamp(14px, 2.4vw, 18px);
    align-items: center;
  }
  .auto-s01-005 .card-media {
    aspect-ratio: 1 / 1;
    margin-bottom: 0;
  }
  .auto-s01-005 .card-media .slot-label { font-size: 0.6rem; letter-spacing: 0.1em; }
  /* With the card in flow the word would crop into the card rather than the vehicle, so the
     overlap is released here — the layering simplifies rather than degrading. */
  .auto-s01-005 .word { margin-top: clamp(-18px, -2.4vw, 0px); }
}

@media (max-width: 480px) {
  .auto-s01-005 .media { aspect-ratio: 4 / 3; }
  .auto-s01-005 .card {
    grid-template-columns: minmax(0, 84px) minmax(0, 1fr);
    align-items: start;
  }
  .auto-s01-005 .btn { width: 100%; justify-content: center; }
  .auto-s01-005 .word { letter-spacing: -0.035em; }
}

@media (prefers-reduced-motion: reduce) {
  .auto-s01-005 * { transition: none !important; }
}
</style>
</head>
<body>

<main class="auto-s01-005" data-study-id="AUTO-S01-005" data-direction="Art-directed / Distinctive">
  <section class="stage" aria-labelledby="auto-s01-005-title">
    <div class="frame">

      <div class="copy">
        <p class="eyebrow">Performance series</p>
        <h1 id="auto-s01-005-title">
          <span class="line">Every detail</span>
          <span class="line line--accent">built to move</span>
        </h1>
        <a class="btn" href="#auto-s01-005-title">
          Explore the series
          <span aria-hidden="true">&rarr;</span>
        </a>
      </div>

      <div class="stack">
        <div class="media">
          <span class="slot-label">Vehicle media</span>
        </div>

        <div class="card">
          <div class="card-media">
            <span class="slot-label">Interior detail media</span>
          </div>
          <div class="card-body">
            <h2>Interior detail</h2>
            <p>Shaped around the person driving, down to the smallest control.</p>
            <a class="card-link" href="#auto-s01-005-title">
              <span class="label">Explore</span>
              <span class="disc" aria-hidden="true">
                <svg width="14" height="12" viewBox="0 0 14 12" focusable="false" aria-hidden="true">
                  <path d="M8 1l5 5-5 5M13 6H1" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
              </span>
            </a>
          </div>
        </div>
      </div>

      <p class="word">MOTION</p>

    </div>
  </section>
</main>

</body>
</html>
