<style>
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: #eef0ee; }

.well-s02-003 {
  --paper: #eef0ee; --ink: #1f2624; --muted: #5f6764; --line: #cdd2cf; --line-strong: #1f2624;
  --media: #dcdfdb; --accent: #2f5c4b;
  --serif: Georgia, "Times New Roman", "Iowan Old Style", serif;
  box-sizing: border-box; display: block; background: var(--paper); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 1rem; line-height: 1.6; -webkit-font-smoothing: antialiased;
}
.well-s02-003 *, .well-s02-003 *::before, .well-s02-003 *::after { box-sizing: inherit; }
.well-s02-003 :focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

.well-s02-003 .shell { width: min(100%, 96rem); margin: 0 auto; padding: clamp(2.5rem, 6vw, 6rem) clamp(1rem, 4.5vw, 4.5rem); }

.well-s02-003 .head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(16rem, 0.5fr); gap: 3rem; align-items: end; padding-bottom: 1.4rem; margin-bottom: clamp(1.4rem, 2.4vw, 2.4rem); border-bottom: 1px solid var(--line-strong); }
.well-s02-003 .eyebrow { margin: 0 0 1rem; color: var(--accent); font-size: 0.62rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; }
.well-s02-003 h2 { margin: 0; max-width: 12ch; font-family: var(--serif); font-weight: 400; font-size: clamp(2.2rem, 3.8vw, 3.8rem); line-height: 0.96; letter-spacing: -0.035em; }
.well-s02-003 h2 em { font-style: italic; }
.well-s02-003 .lead { max-width: 24rem; margin: 0 0 0.3rem auto; color: var(--muted); font-size: 0.86rem; line-height: 1.55; text-align: right; }

.well-s02-003 .mosaic { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(1.4rem, 2.4vw, 2.4rem) clamp(1rem, 1.8vw, 1.6rem); margin: 0; padding: 0; list-style: none; }
.well-s02-003 li { min-width: 0; display: flex; }
.well-s02-003 figure { margin: 0; width: 100%; display: flex; flex-direction: column; }
.well-s02-003 .lead-field { grid-column: 1 / 3; }
.well-s02-003 .media { position: relative; width: 100%; aspect-ratio: 4 / 3; background: var(--media); border-radius: 3px; }
.well-s02-003 .lead-field .media { aspect-ratio: 16 / 9; }
.well-s02-003 .tall .media { flex: 1 1 auto; min-height: 18rem; aspect-ratio: auto; }
.well-s02-003 .slate { position: absolute; left: 0.8rem; bottom: 0.7rem; margin: 0; color: var(--muted); font-size: 0.55rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; }
.well-s02-003 figcaption { padding-top: 0.9rem; }
.well-s02-003 h3 { margin: 0 0 0.5rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--line); font-family: var(--serif); font-weight: 400; font-size: clamp(1.1rem, 1.5vw, 1.4rem); }
.well-s02-003 h3 a { color: var(--ink); text-decoration: none; }
.well-s02-003 h3 a:hover { color: var(--accent); }
.well-s02-003 .lab { display: block; margin: 0.5rem 0 0.1rem; color: var(--accent); font-size: 0.55rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; }
.well-s02-003 .val { margin: 0; font-size: 0.86rem; line-height: 1.5; }
.well-s02-003 .val.soft { color: var(--muted); }

.well-s02-003 .more { margin: clamp(1.6rem, 2.6vw, 2.6rem) 0 0; padding: 0; list-style: none; border-top: 1px solid var(--line-strong); }
.well-s02-003 .more li { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.4fr) auto; gap: 1rem 2rem; align-items: baseline; padding: 1rem 0; border-bottom: 1px solid var(--line); }
.well-s02-003 .more h3 { margin: 0; padding: 0; border: 0; }
.well-s02-003 .more .what { margin: 0; color: var(--muted); font-size: 0.86rem; }
.well-s02-003 .more .fam { margin: 0; color: var(--accent); font-size: 0.55rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; }

@media (max-width: 1024px) {
  .well-s02-003 .mosaic { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .well-s02-003 .lead-field { grid-column: 1 / -1; }
  .well-s02-003 .tall .media { flex: none; min-height: 0; aspect-ratio: 4 / 3; }
}
@media (max-width: 768px) {
  .well-s02-003 .head { grid-template-columns: minmax(0, 1fr); gap: 1rem; }
  .well-s02-003 .lead { margin-left: 0; text-align: left; }
  .well-s02-003 .more li { grid-template-columns: minmax(0, 1fr) auto; }
  .well-s02-003 .more .what { grid-column: 1 / -1; }
}
@media (max-width: 480px) {
  .well-s02-003 .mosaic { grid-template-columns: minmax(0, 1fr); }
  .well-s02-003 .media, .well-s02-003 .lead-field .media { aspect-ratio: 4 / 3; }
}
@media (prefers-reduced-motion: reduce) { .well-s02-003 * { transition: none !important; scroll-behavior: auto !important; } }
</style>

<div class="well-s02-003" data-study-id="WELL-S02-003" data-direction="Structured / Visual Modular">

    </ul>

  </section>
