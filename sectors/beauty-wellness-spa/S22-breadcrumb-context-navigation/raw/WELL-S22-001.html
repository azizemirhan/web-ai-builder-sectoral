  Layout model   : One line: four levels in tracked uppercase at label size, separated by thin

  Content note   : Page names from the sector's established vocabulary only; no count, price,

<meta name="sector" content="Beauty, Wellness &amp; Spa">
<meta name="sector-prefix" content="WELL">

<meta name="density" content="hero">

<meta name="dependencies" content="none">

<title>WELL-S22-001 — Breadcrumb / Context Navigation, Universal / Safe</title>

<style>
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: #f2f0ea; }

.well-s22-001 {
  --paper: #f2f0ea; --ink: #23281f; --muted: #6a6d62; --line: #d3d0c5; --line-strong: #23281f;
  --media: #e1dfd5; --accent: #5a6b48;
  --serif: Georgia, "Times New Roman", "Iowan Old Style", serif;
  box-sizing: border-box; display: block; background: var(--paper); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 1rem; line-height: 1.6; -webkit-font-smoothing: antialiased;
}
.well-s22-001 *, .well-s22-001 *::before, .well-s22-001 *::after { box-sizing: inherit; }
.well-s22-001 :focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

.well-s22-001 .shell { width: min(100%, 92rem); margin: 0 auto; padding: clamp(1.2rem, 2.4vw, 2.4rem) clamp(1rem, 4vw, 4rem); }
.well-s22-001 .trail { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.5rem 0.9rem; margin: 0; padding: 0 0 0.9rem; list-style: none; border-bottom: 1px solid var(--line); font-size: 0.62rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; }
.well-s22-001 .trail li { display: flex; align-items: baseline; gap: 0.9rem; }
.well-s22-001 .trail a { color: var(--muted); text-decoration: none; padding: 0.4rem 0; transition: color 160ms ease; }
.well-s22-001 .trail a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 0.3em; text-decoration-color: var(--accent); }
.well-s22-001 .trail [aria-current="page"] { color: var(--ink); }
.well-s22-001 .sep { color: var(--accent); font-weight: 400; }

@media (prefers-reduced-motion: reduce) { .well-s22-001 * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>

<div class="well-s22-001" data-study-id="WELL-S22-001" data-direction="Universal / Safe">
  <section class="shell">
    <nav aria-label="Where you are">
      <ol class="trail">
        <li><a href="#home">Home</a><span class="sep" aria-hidden="true">/</span></li>
        <li><a href="#treatments">Treatments</a><span class="sep" aria-hidden="true">/</span></li>
        <li><a href="#facials">Facials</a><span class="sep" aria-hidden="true">/</span></li>
        <li><span aria-current="page">Deep cleansing facial</span></li>
      </ol>
    </nav>
  </section>
</div>

</body>
</html>
