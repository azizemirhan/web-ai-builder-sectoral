<style>
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: #eef0ee; }

.well-s22-003 {
  --paper: #eef0ee; --ink: #1f2624; --muted: #5f6764; --line: #cdd2cf; --line-strong: #1f2624;
  --media: #dcdfdb; --accent: #2f5c4b;
  --serif: Georgia, "Times New Roman", "Iowan Old Style", serif;
  box-sizing: border-box; display: block; background: var(--paper); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 1rem; line-height: 1.6; -webkit-font-smoothing: antialiased;
}
.well-s22-003 *, .well-s22-003 *::before, .well-s22-003 *::after { box-sizing: inherit; }
.well-s22-003 :focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

.well-s22-003 .shell { width: min(100%, 92rem); margin: 0 auto; padding: clamp(1.2rem, 2.4vw, 2.4rem) clamp(1rem, 4vw, 4rem); }
.well-s22-003 .trail { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.5rem 0.9rem; margin: 0; padding: 0 0 0.9rem; list-style: none; border-bottom: 1px solid var(--line-strong); font-size: 0.62rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; }
.well-s22-003 .trail li { display: flex; align-items: baseline; gap: 0.9rem; }
.well-s22-003 .trail a { color: var(--muted); text-decoration: none; padding: 0.4rem 0; }
.well-s22-003 .trail a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 0.3em; text-decoration-color: var(--accent); }
.well-s22-003 .trail [aria-current="page"] { color: var(--ink); }
.well-s22-003 .sep { color: var(--accent); font-weight: 400; }

.well-s22-003 .also { margin: 0; padding: 0.8rem 0 0.5rem; color: var(--accent); font-size: 0.58rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; }
.well-s22-003 .sibs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.well-s22-003 .sibs li { display: flex; align-items: baseline; gap: 0.7rem; padding: 0.8rem 1rem; }
.well-s22-003 .sibs li + li { border-left: 1px solid var(--line); }
.well-s22-003 .sibs .n { color: var(--accent); font-size: 0.58rem; font-weight: 700; letter-spacing: 0.16em; }
.well-s22-003 .sibs a, .well-s22-003 .sibs [aria-current="page"] { font-family: var(--serif); font-size: 1rem; color: var(--muted); text-decoration: none; }
.well-s22-003 .sibs a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 0.25em; text-decoration-color: var(--accent); }
.well-s22-003 .sibs [aria-current="page"] { color: var(--ink); }

@media (max-width: 768px) { .well-s22-003 .sibs { grid-template-columns: repeat(2, minmax(0, 1fr)); } .well-s22-003 .sibs li + li { border-left: 0; } .well-s22-003 .sibs li:nth-child(even) { border-left: 1px solid var(--line); } .well-s22-003 .sibs li:nth-child(n+3) { border-top: 1px solid var(--line); } }
@media (max-width: 480px) { .well-s22-003 .sibs { grid-template-columns: minmax(0, 1fr); } .well-s22-003 .sibs li { padding-inline: 0; } .well-s22-003 .sibs li:nth-child(even) { border-left: 0; } .well-s22-003 .sibs li:nth-child(n+2) { border-top: 1px solid var(--line); } }
@media (prefers-reduced-motion: reduce) { .well-s22-003 * { transition: none !important; scroll-behavior: auto !important; } }
