<title>WELL-S22-005 — Breadcrumb / Context Navigation, Sector-native / Distinctive</title>

<style>
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: #f8f4f3; }

.well-s22-005 {
  --paper: #f8f4f3; --ink: #2b2226; --muted: #6d6266; --line: #e0d6d9; --line-strong: #2b2226;
  --media: #eae1e3; --accent: #6e3b4e;
  --serif: Georgia, "Times New Roman", "Iowan Old Style", serif;
  box-sizing: border-box; display: block; background: var(--paper); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 1rem; line-height: 1.6; -webkit-font-smoothing: antialiased;
}
.well-s22-005 *, .well-s22-005 *::before, .well-s22-005 *::after { box-sizing: inherit; }
.well-s22-005 :focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

.well-s22-005 .shell { width: min(100%, 92rem); margin: 0 auto; padding: clamp(1.2rem, 2.4vw, 2.4rem) clamp(1rem, 4vw, 4rem); }
.well-s22-005 .eyebrow { margin: 0; padding: 0.9rem 0 0.4rem; border-top: 1px solid var(--line-strong); color: var(--accent); font-size: 0.6rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; }
.well-s22-005 .trail { margin: 0; padding: 0 0 1rem; list-style: none; border-bottom: 1px solid var(--line); font-family: var(--serif); font-size: clamp(1.2rem, 2vw, 1.8rem); line-height: 1.45; letter-spacing: -0.015em; }
.well-s22-005 .trail li { display: inline; }
.well-s22-005 .say { color: var(--muted); }
.well-s22-005 .trail a { color: var(--ink); text-decoration: underline; text-underline-offset: 0.22em; text-decoration-color: var(--line-strong); transition: text-decoration-color 160ms ease; }
.well-s22-005 .trail a:hover { text-decoration-color: var(--accent); }
.well-s22-005 .trail [aria-current="page"] { font-style: italic; color: var(--accent); }

@media (prefers-reduced-motion: reduce) { .well-s22-005 * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>

<div class="well-s22-005" data-study-id="WELL-S22-005" data-direction="Sector-native / Distinctive">
  <section class="shell">
    <nav aria-label="Where you are">
      <p class="eyebrow">Where you are</p>
      <ol class="trail"><li><span class="say" aria-hidden="true">Under </span><a href="#treatments">Treatments</a><span class="say" aria-hidden="true">, </span></li><li><span class="say" aria-hidden="true">inside </span><a href="#facials">Facials</a><span class="say" aria-hidden="true">, </span></li><li><span class="say" aria-hidden="true">you are looking at the </span><span aria-current="page">Deep cleansing facial</span><span class="say" aria-hidden="true">.</span></li></ol>
    </nav>
  </section>
</div>

</body>
