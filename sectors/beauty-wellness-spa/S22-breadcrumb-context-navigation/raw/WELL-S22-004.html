<title>WELL-S22-004 — Breadcrumb / Context Navigation, Conversion-led</title>

<style>
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: #f7f2e8; }

.well-s22-004 {
  --paper: #f7f2e8; --ink: #2b251d; --muted: #6e655a; --line: #dfd6c8; --line-strong: #2b251d;
  --media: #e9e1d2; --accent: #9a6b2a;
  --serif: Georgia, "Times New Roman", "Iowan Old Style", serif;
  box-sizing: border-box; display: block; background: var(--paper); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 1rem; line-height: 1.6; -webkit-font-smoothing: antialiased;
}
.well-s22-004 *, .well-s22-004 *::before, .well-s22-004 *::after { box-sizing: inherit; }
.well-s22-004 :focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

.well-s22-004 .shell { width: min(100%, 92rem); margin: 0 auto; padding: clamp(1.2rem, 2.4vw, 2.4rem) clamp(1rem, 4vw, 4rem); }
.well-s22-004 .line { display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(14rem, 0.5fr); gap: 1.5rem 2rem; align-items: center; padding: 0.9rem 0; border-top: 1px solid var(--line-strong); border-bottom: 1px solid var(--line); }
.well-s22-004 .btn { display: inline-flex; align-items: center; gap: 0.6rem; padding: 0.75rem 1.2rem; border: 1px solid var(--ink); border-radius: 2px; color: var(--ink); text-decoration: none; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; white-space: nowrap; transition: background-color 160ms ease, color 160ms ease, border-color 160ms ease; }
.well-s22-004 .btn:hover { background: var(--accent); border-color: var(--accent); color: var(--paper); }
.well-s22-004 .btn span { color: var(--accent); }
.well-s22-004 .btn:hover span { color: var(--paper); }
.well-s22-004 .trail { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.4rem 0.9rem; margin: 0; padding: 0; list-style: none; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; }
.well-s22-004 .trail li { display: flex; align-items: baseline; gap: 0.9rem; }
.well-s22-004 .trail a { color: var(--muted); text-decoration: none; padding: 0.4rem 0; }
.well-s22-004 .trail a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 0.3em; text-decoration-color: var(--accent); }
.well-s22-004 .trail [aria-current="page"] { color: var(--ink); }
.well-s22-004 .sep { color: var(--accent); font-weight: 400; }
.well-s22-004 .why { margin: 0; color: var(--muted); font-size: 0.8rem; line-height: 1.5; text-align: right; }

@media (max-width: 1024px) { .well-s22-004 .line { grid-template-columns: auto minmax(0, 1fr); } .well-s22-004 .why { grid-column: 1 / -1; text-align: left; } }
@media (max-width: 480px) { .well-s22-004 .line { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: reduce) { .well-s22-004 * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>

<div class="well-s22-004" data-study-id="WELL-S22-004" data-direction="Conversion-led">
  <section class="shell">
    <nav aria-label="Where you are, and the way back">
      <div class="line">
        <a class="btn" href="#facials"><span aria-hidden="true">&#8592;</span>All facials</a>
        <ol class="trail">
          <li><a href="#home">Home</a><span class="sep" aria-hidden="true">/</span></li>
          <li><a href="#treatments">Treatments</a><span class="sep" aria-hidden="true">/</span></li>
          <li><a href="#facials">Facials</a><span class="sep" aria-hidden="true">/</span></li>
          <li><span aria-current="page">Deep cleansing facial</span></li>
        </ol>
        <p class="why">Most people reach a page like this from a search rather than from our menu, so the way back to the rest of them is here rather than only at the top of the site.</p>
      </div>
    </nav>
  </section>
</div>

</body>
</html>
