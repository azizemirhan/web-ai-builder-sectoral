<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!--
  WebAIBuilder — Sector Design Authoring Workspace
  Raw study. Standalone HTML. Scoped CSS. No framework, CDN, or remote runtime dependency.

  Study ID       : WELL-S01-003
  Sector         : Beauty, Wellness & Spa (WELL)
  Section        : WELL-S01 — Hero
  Direction      : Structured / Visual Modular
  Reference      : Supplied visual research — reference 3 of five images provided with the
                   authoring request (a warm dark tonal frame, a centred two-line statement set
                   over a dominant face, one word of the statement carried inside a soft rounded
                   box, a very short lead and a single pill action). Taken for its warm dark
                   tonal field and for the marked-word device inside the heading. Its centred
                   full-bleed overlay arrangement was not taken — that topology belongs to the
                   conversion-led study in this set — and its "built on Proof" and
                   "tested to perform" efficacy language was not carried across at all, per the
                   claims rule in ../../WELLNESS-DESIGN-DIRECTION.md. No layout, brand, wording
                   or photograph from that image is reproduced.
  Layout model   : Modular bento hero — a twelve-column field holding a copy module, one
                   dominant media module, one small media module, a grouped category module and
                   a short statement module
  Density        : Medium, carried by module structure rather than by copy volume
  Media mode     : Two reserved media areas at two scales — one dominant, one small. No image is
                   supplied.
  Interaction    : None (static; no JavaScript)
  Content note   : Neutral placeholder copy. No treatment claim, efficacy statement, percentage,
                   ingredient claim, price, duration, practitioner name, qualification, client,
                   rating or address. The category module carries four category names only — it
                   is a grouping device, not a treatment menu or a tariff. All media areas are
                   reserved and intentionally empty.
-->

<meta name="study-id" content="WELL-S01-003">
<meta name="sector" content="Beauty, Wellness &amp; Spa">
<meta name="sector-prefix" content="WELL">
<meta name="section-id" content="WELL-S01">
<meta name="section-name" content="Hero">
<meta name="variant" content="003">
<meta name="territory" content="Structured / Visual Modular">
<meta name="direction" content="Structured / Visual Modular">
<meta name="layout-model" content="Modular bento hero on a twelve-column field with two media scales">
<meta name="density" content="medium">
<meta name="media-mode" content="reserved-media-two-scales-modular">
<meta name="interaction" content="none">
<meta name="dependencies" content="none">
<meta name="batch" content="V1">

<title>WELL-S01-003 — Hero, Structured / Visual Modular</title>

<style>
/* Standalone host baseline */
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: #191210; }

/* Scoped study styles — namespaced to .well-s01-003 */
.well-s01-003 {
  --ink: #f4ece5;
  --ink-soft: #b09a8d;
  --paper: #191210;
  --panel: #221816;
  --slot: #2e211b;
  --slot-ink: #a08a7c;
  --line: #3a2b25;
  --accent: #c9714b;
  --accent-ink: #191210;
  --mark: #3a2620;
  --focus: #e0996f;

  box-sizing: border-box;
  display: block;
  background: var(--paper);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 1rem;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
.well-s01-003 *,
.well-s01-003 *::before,
.well-s01-003 *::after { box-sizing: inherit; }
.well-s01-003 :focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 3px;
  border-radius: 4px;
}

.well-s01-003 .shell {
  width: 100%;
  max-width: 1440px;
  margin: 0 auto;
  padding: clamp(32px, 4vw, 60px) clamp(20px, 3.6vw, 52px);
}

.well-s01-003 .grid {
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  gap: clamp(12px, 1.4vw, 20px);
}

.well-s01-003 .cell {
  min-width: 0;
  border-radius: 16px;
}

/* Copy module */
.well-s01-003 .cell--copy {
  grid-column: span 5;
  background: var(--panel);
  padding: clamp(26px, 2.8vw, 44px);
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.well-s01-003 .eyebrow {
  margin: 0 0 clamp(16px, 1.8vw, 22px);
  font-size: 0.7rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.well-s01-003 h1 {
  margin: 0;
  font-size: clamp(1.9rem, 3.2vw, 3rem);
  line-height: 1.1;
  letter-spacing: -0.018em;
  font-weight: 500;
  max-width: 15ch;
}
.well-s01-003 h1 .marked {
  display: inline-block;
  padding: 0.04em 0.3em;
  border-radius: 8px;
  background: var(--mark);
  color: var(--accent);
}
.well-s01-003 .lead {
  margin: clamp(18px, 2vw, 24px) 0 0;
  max-width: 32ch;
  color: var(--ink-soft);
  font-size: 0.98rem;
}
.well-s01-003 .btn {
  align-self: flex-start;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin: clamp(24px, 2.6vw, 34px) 0 0;
  min-height: 52px;
  padding: 0 28px;
  border-radius: 999px;
  background: var(--accent);
  color: var(--accent-ink);
  font-size: 0.95rem;
  font-weight: 600;
  text-decoration: none;
  transition: background-color 140ms ease;
}
.well-s01-003 .btn:hover { background: #d98259; }
.well-s01-003 .btn .arrow { font-size: 1.05em; line-height: 1; }

/* Media modules */
.well-s01-003 .cell--media-major { grid-column: span 7; }
.well-s01-003 .cell--media-minor { grid-column: span 3; }

.well-s01-003 .slot {
  height: 100%;
  border-radius: 16px;
  background: var(--slot);
  display: grid;
  place-items: center;
  padding: 20px;
}
.well-s01-003 .cell--media-major .slot { min-height: clamp(340px, 40vw, 520px); }
.well-s01-003 .cell--media-minor .slot { min-height: clamp(180px, 18vw, 230px); }
.well-s01-003 .slot-label {
  font-size: 0.7rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--slot-ink);
  text-align: center;
}

/* Grouped category module */
.well-s01-003 .cell--group {
  grid-column: span 5;
  background: var(--panel);
  padding: clamp(20px, 2.2vw, 30px);
}
.well-s01-003 .cell--group h2 {
  margin: 0 0 clamp(14px, 1.6vw, 18px);
  font-size: 0.7rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  font-weight: 600;
  color: var(--ink-soft);
}
.well-s01-003 .cats { margin: 0; padding: 0; list-style: none; }
.well-s01-003 .cats li { border-top: 1px solid var(--line); }
.well-s01-003 .cats li:first-child { border-top: 0; }
.well-s01-003 .cats a {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  min-height: 48px;
  color: var(--ink);
  font-size: 0.97rem;
  text-decoration: none;
}
.well-s01-003 .cats a:hover { color: var(--accent); }
.well-s01-003 .cats .arrow { color: var(--ink-soft); font-size: 1em; line-height: 1; }
.well-s01-003 .cats a:hover .arrow { color: var(--accent); }

/* Short statement module */
.well-s01-003 .cell--note {
  grid-column: span 4;
  background: var(--panel);
  padding: clamp(20px, 2.2vw, 30px);
  display: flex;
  align-items: center;
}
.well-s01-003 .cell--note p {
  margin: 0;
  max-width: 26ch;
  color: var(--ink-soft);
  font-size: 0.93rem;
  line-height: 1.55;
}

/* Responsive ladder */
@media (max-width: 1024px) {
  .well-s01-003 .grid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .well-s01-003 .cell--copy { grid-column: span 6; }
  .well-s01-003 .cell--media-major { grid-column: span 6; }
  .well-s01-003 .cell--media-major .slot { min-height: 0; aspect-ratio: 16 / 9; }
  .well-s01-003 .cell--media-minor { grid-column: span 2; }
  .well-s01-003 .cell--media-minor .slot { min-height: 0; aspect-ratio: 3 / 4; }
  .well-s01-003 .cell--group { grid-column: span 4; }
  .well-s01-003 .cell--note { grid-column: span 6; }
  .well-s01-003 h1 { max-width: 18ch; }
}

@media (max-width: 768px) {
  .well-s01-003 .cell--media-minor { grid-column: span 6; }
  .well-s01-003 .cell--media-minor .slot { aspect-ratio: 16 / 9; }
  .well-s01-003 .cell--group { grid-column: span 6; }
  .well-s01-003 .cell--media-major .slot { aspect-ratio: 4 / 3; }
  .well-s01-003 .lead { max-width: none; }
  .well-s01-003 .cell--note p { max-width: none; }
}

@media (max-width: 480px) {
  .well-s01-003 .grid { gap: 10px; }
  .well-s01-003 .cell { border-radius: 14px; }
  .well-s01-003 .cell--media-major .slot { aspect-ratio: 1 / 1; }
  .well-s01-003 .btn { width: 100%; justify-content: center; }
  .well-s01-003 h1 { max-width: none; }
}

@media (prefers-reduced-motion: reduce) {
  .well-s01-003 * { transition: none !important; }
}
</style>
</head>
<body>

<main class="well-s01-003" data-study-id="WELL-S01-003" data-direction="Structured / Visual Modular">
  <section class="hero" aria-labelledby="well-s01-003-title">
    <div class="shell">
      <div class="grid">

        <div class="cell cell--copy">
          <p class="eyebrow">The studio</p>
          <h1 id="well-s01-003-title">Treatments built around <span class="marked">your</span> skin</h1>
          <p class="lead">Four ways in. Start wherever makes sense today.</p>
          <a class="btn" href="#well-s01-003-title">
            Find your treatment
            <span class="arrow" aria-hidden="true">&rarr;</span>
          </a>
        </div>

        <div class="cell cell--media-major">
          <div class="slot"><span class="slot-label">Treatment in progress</span></div>
        </div>

        <div class="cell cell--media-minor">
          <div class="slot"><span class="slot-label">Texture</span></div>
        </div>

        <div class="cell cell--group">
          <h2>Where to begin</h2>
          <ul class="cats">
            <li><a href="#well-s01-003-title">Facials <span class="arrow" aria-hidden="true">&rarr;</span></a></li>
            <li><a href="#well-s01-003-title">Body &amp; massage <span class="arrow" aria-hidden="true">&rarr;</span></a></li>
            <li><a href="#well-s01-003-title">Hands &amp; feet <span class="arrow" aria-hidden="true">&rarr;</span></a></li>
            <li><a href="#well-s01-003-title">Brows &amp; lashes <span class="arrow" aria-hidden="true">&rarr;</span></a></li>
          </ul>
        </div>

        <div class="cell cell--note">
          <p>Every visit opens with a short conversation, not a form.</p>
        </div>

      </div>
    </div>
  </section>
</main>

</body>
</html>
