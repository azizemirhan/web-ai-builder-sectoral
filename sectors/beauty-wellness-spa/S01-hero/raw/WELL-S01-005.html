<title>WELL-S01-005 — Hero, Art-directed / Distinctive</title>

<style>
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: #f8f4f3; }

.well-s01-005 {
  --paper: #f8f4f3; --ink: #2b2226; --muted: #6d6266; --line: #e0d6d9; --line-strong: #2b2226;
  --media: #eae1e3; --accent: #6e3b4e;
  --serif: Georgia, "Times New Roman", "Iowan Old Style", serif;
  box-sizing: border-box; display: block; background: var(--paper); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 1rem; line-height: 1.6; -webkit-font-smoothing: antialiased;
}
.well-s01-005 *, .well-s01-005 *::before, .well-s01-005 *::after { box-sizing: inherit; }
.well-s01-005 :focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

.well-s01-005 .shell { width: min(100%, 96rem); margin: 0 auto; padding: clamp(2rem, 5vw, 5rem) clamp(1rem, 4vw, 4rem); border-top: 1px solid var(--line); }

.well-s01-005 .head { display: grid; grid-template-columns: 1fr minmax(16rem, 0.5fr); gap: 3rem; align-items: end; padding: 1.6rem 0 1.4rem; }
.well-s01-005 .eyebrow { margin: 0 0 1rem; color: var(--accent); font-size: 0.62rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; }
.well-s01-005 h1 { margin: 0; max-width: 8ch; font-size: clamp(3rem, 8vw, 8.5rem); font-weight: 500; line-height: 0.83; letter-spacing: -0.065em; text-transform: uppercase; }
.well-s01-005 .lead { max-width: 26rem; margin: 0 0 0.4rem auto; font-size: 0.9rem; line-height: 1.55; text-align: right; color: var(--muted); }

.well-s01-005 .cells { display: grid; grid-template-columns: 1.6fr 1fr; border-top: 1px solid var(--line-strong); border-bottom: 1px solid var(--line); }
.well-s01-005 article { min-width: 0; display: flex; flex-direction: column; }
.well-s01-005 article + article { border-left: 1px solid var(--line); }
.well-s01-005 .media { position: relative; width: 100%; background: var(--media); border-bottom: 1px solid var(--line); }
.well-s01-005 .wide .media { aspect-ratio: 16 / 9; }
.well-s01-005 .tall .media { flex: 1 1 auto; min-height: 18rem; }
.well-s01-005 .slate { position: absolute; left: 0.9rem; bottom: 0.8rem; margin: 0; color: var(--muted); font-size: 0.55rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; }
.well-s01-005 .caption { display: grid; grid-template-columns: 1fr auto; gap: 1rem; align-items: start; padding: 1.1rem 1rem 1.3rem; }
.well-s01-005 .type { margin: 0 0 0.35rem; color: var(--accent); font-size: 0.58rem; font-weight: 700; letter-spacing: 0.13em; text-transform: uppercase; }
.well-s01-005 h2 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: clamp(1.3rem, 2.2vw, 2rem); letter-spacing: -0.01em; }
.well-s01-005 h2 em { font-style: italic; }
.well-s01-005 .meta { margin: 0; color: var(--muted); font-size: 0.6rem; font-weight: 700; letter-spacing: 0.08em; line-height: 1.6; text-align: right; text-transform: uppercase; }
.well-s01-005 .go { display: inline-flex; align-items: center; justify-content: center; width: 2.8rem; min-height: 2.8rem; margin-top: 0.8rem; margin-left: auto; border: 1px solid var(--line-strong); border-radius: 50%; color: var(--ink); text-decoration: none; }
.well-s01-005 .go:hover { color: var(--paper); background: var(--accent); border-color: var(--accent); }

@media (max-width: 768px) {
  .well-s01-005 .head { grid-template-columns: 1fr; gap: 1.2rem; }
  .well-s01-005 .lead { margin-left: 0; text-align: left; }
  .well-s01-005 .cells { grid-template-columns: 1fr; }
  .well-s01-005 article + article { border-left: 0; border-top: 1px solid var(--line-strong); }
  .well-s01-005 .tall .media { flex: none; min-height: 0; aspect-ratio: 4 / 5; }
}
@media (max-width: 480px) {
  .well-s01-005 .caption { grid-template-columns: 1fr; padding-inline: 0; }
  .well-s01-005 .meta { text-align: left; }
  .well-s01-005 .go { margin-left: 0; }
  .well-s01-005 .wide .media { aspect-ratio: 4 / 3; }
}
@media (prefers-reduced-motion: reduce) { .well-s01-005 * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>

<main class="well-s01-005" data-study-id="WELL-S01-005" data-direction="Art-directed / Distinctive">
  <section class="shell" aria-labelledby="well-s01-005-title">

    <div class="head">
      <div>
        <p class="eyebrow">Signature treatments</p>
        <h1 id="well-s01-005-title">The long exhale</h1>
      </div>
      <p class="lead">Unhurried work, shaped in the room around the skin you arrive with.</p>
    </div>

    <div class="cells">
      <article class="wide">
        <div class="media" role="img" aria-label="Reserved image field: steam over water, long view"><p class="slate" aria-hidden="true">Image area &middot; 16:9 &middot; steam</p></div>
        <div class="caption">
          <div><p class="type">The room</p><h2>Water, warmth, <em>quiet</em></h2></div>
          <p class="meta">Long view<br>Still</p>
        </div>
      </article>
      <article class="tall">
        <div class="media" role="img" aria-label="Reserved image field: the practitioner's hands with warm stones"><p class="slate" aria-hidden="true">Detail &middot; 4:5</p></div>
        <div class="caption">
          <div><p class="type">The work</p><h2>Hands, stone, time</h2></div>
          <div><p class="meta">Detail</p><a class="go" href="#well-s01-005-title" aria-label="See signature treatments">&#8599;</a></div>
        </div>
      </article>
    </div>

  </section>
</main>

</body>
