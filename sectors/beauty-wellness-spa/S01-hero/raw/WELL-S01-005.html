<!--
  WebAIBuilder — Sector Design Authoring Workspace
  Raw study. Standalone HTML. Scoped CSS. No framework, CDN, or remote runtime dependency.

  Study ID       : WELL-S01-005
  Sector         : Beauty, Wellness & Spa (WELL)
  Section        : WELL-S01 — Hero
  Direction      : Art-directed / Distinctive
  Reference      : Supplied visual research — reference 5 of five images provided with the
                   authoring request (a saturated colour field, a copy block held to the left, a
                   dominant portrait holding the centre, and a small detail card floating over
                   the portrait's edge). Taken for its layering logic — a saturated ground, a
                   dominant offset media plane, and a small card breaking across that plane's
                   edge — and for the confidence of its colour. Its site navigation was not
                   taken, per the section-shell rule; its product content model and its price
                   were not taken at all, per the claims rule in
                   ../../WELLNESS-DESIGN-DIRECTION.md, and the floating card here carries a
                   treatment name and a reserved thumbnail with no figure of any kind. No layout,
                   brand, wording or photograph from that image is reproduced.
  Layout model   : Layered hero on a saturated field — an oversized two-line type plane behind,
                   a dominant offset media plane cropping into it, a floating detail card
                   breaking the media edge, and a small copy block held bottom-left
  Density        : Low
  Media mode     : One dominant reserved media plane plus one small reserved thumbnail inside the
                   floating card. No image is supplied.
  Interaction    : None (static; no JavaScript)
  Content note   : Neutral placeholder copy. No treatment claim, efficacy statement, percentage,
                   ingredient claim, price, duration, practitioner name, qualification, client,
                   rating or address. The display words are a typographic device, not a brand or
                   a wordmark. Both media areas are reserved and intentionally empty, and the
                   layered composition remains legible in that empty state at every width.
-->

<meta name="study-id" content="WELL-S01-005">
<meta name="sector" content="Beauty, Wellness &amp; Spa">
<meta name="sector-prefix" content="WELL">
<meta name="section-id" content="WELL-S01">
<meta name="section-name" content="Hero">
<meta name="variant" content="005">
<meta name="territory" content="Art-directed / Distinctive">
<meta name="direction" content="Art-directed / Distinctive">
<meta name="layout-model" content="Layered hero with oversized type plane, offset media plane and floating detail card">
<meta name="density" content="low">
<meta name="media-mode" content="reserved-media-layered-plane-plus-card-thumbnail">
<meta name="interaction" content="none">
<meta name="dependencies" content="none">
<meta name="batch" content="V1">

<title>WELL-S01-005 — Hero, Art-directed / Distinctive</title>

<style>
/* Standalone host baseline */
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: #10555c; }

/* Scoped study styles — namespaced to .well-s01-005 */
.well-s01-005 {
  --ink: #f0efe6;
  --ink-soft: #b6ccca;
  --paper: #10555c;
  --type-plane: #74afae;
  --slot: #0a4148;
  --slot-ink: #8fb3b3;
  --card: #f2eee4;
  --card-ink: #17383b;
  --card-soft: #5d7a7b;
  --card-slot: #dcd6c8;
  --focus: #e7d9b8;

  box-sizing: border-box;
  display: block;
  background: var(--paper);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 1rem;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
.well-s01-005 *,
.well-s01-005 *::before,
.well-s01-005 *::after { box-sizing: inherit; }
.well-s01-005 :focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 3px;
  border-radius: 4px;
}

.well-s01-005 .stage {
  overflow: hidden;
  padding: clamp(34px, 4.4vw, 72px) clamp(20px, 3.6vw, 56px) clamp(30px, 3.6vw, 56px);
}
.well-s01-005 .canvas {
  width: 100%;
  max-width: 1440px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  grid-template-rows: auto auto;
  column-gap: clamp(12px, 1.4vw, 22px);
}

/* Type plane — sits behind everything */
.well-s01-005 .typeplane {
  grid-column: 1 / -1;
  grid-row: 1;
  z-index: 1;
  align-self: start;
}
.well-s01-005 h1 {
  margin: 0;
  font-size: clamp(3.6rem, 13.5vw, 12rem);
  line-height: 0.82;
  letter-spacing: -0.05em;
  font-weight: 500;
  color: var(--type-plane);
  white-space: nowrap;
}
.well-s01-005 h1 .line { display: block; }
.well-s01-005 h1 .line--in { padding-left: 0.09em; }

/* Dominant media plane — crops into the type */
.well-s01-005 .media {
  grid-column: 6 / 12;
  grid-row: 1 / 3;
  z-index: 2;
  align-self: center;
  min-width: 0;
}
.well-s01-005 .slot {
  background: var(--slot);
  border-radius: 2px;
  aspect-ratio: 4 / 5;
  display: grid;
  place-items: center;
  padding: 20px;
}
.well-s01-005 .slot-label {
  font-size: 0.72rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--slot-ink);
  text-align: center;
}

/* Copy block — held bottom-left */
.well-s01-005 .copy {
  grid-column: 1 / 5;
  grid-row: 2;
  z-index: 2;
  align-self: end;
  min-width: 0;
  padding-bottom: clamp(8px, 1.6vw, 26px);
}
.well-s01-005 .eyebrow {
  margin: 0 0 clamp(12px, 1.4vw, 18px);
  font-size: 0.7rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.well-s01-005 .lead {
  margin: 0;
  max-width: 30ch;
  color: var(--ink);
  font-size: clamp(0.98rem, 1.05vw, 1.1rem);
  line-height: 1.55;
}
.well-s01-005 .textlink {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  margin: clamp(18px, 2vw, 26px) 0 0;
  min-height: 44px;
  color: var(--ink);
  font-size: 0.93rem;
  font-weight: 600;
  text-decoration: underline;
  text-underline-offset: 6px;
  text-decoration-thickness: 1px;
}
.well-s01-005 .textlink:hover { text-decoration-thickness: 2px; }

/* Floating card — breaks the media edge */
.well-s01-005 .card {
  grid-column: 4 / 8;
  grid-row: 2;
  z-index: 3;
  align-self: end;
  background: var(--card);
  color: var(--card-ink);
  border-radius: 14px;
  padding: clamp(14px, 1.3vw, 18px);
  display: flex;
  align-items: center;
  gap: clamp(14px, 1.4vw, 20px);
}
.well-s01-005 .card-slot {
  flex: none;
  width: clamp(64px, 6.6vw, 92px);
  aspect-ratio: 1 / 1;
  border-radius: 10px;
  background: var(--card-slot);
  display: grid;
  place-items: center;
  padding: 6px;
}
.well-s01-005 .card-slot span {
  font-size: 0.56rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--card-soft);
  text-align: center;
}
.well-s01-005 .card-text { min-width: 0; }
.well-s01-005 .card-text h2 {
  margin: 0 0 5px;
  font-size: clamp(1rem, 1.15vw, 1.18rem);
  line-height: 1.25;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.well-s01-005 .card-text p {
  margin: 0;
  color: var(--card-soft);
  font-size: 0.85rem;
  line-height: 1.45;
}

/* Responsive ladder — the layering is kept, not dropped */
@media (max-width: 1024px) {
  .well-s01-005 .canvas { grid-template-rows: auto auto auto; }
  .well-s01-005 .typeplane { grid-column: 1 / -1; grid-row: 1; }
  .well-s01-005 .media {
    grid-column: 3 / 13;
    grid-row: 1 / 3;
    align-self: start;
    margin-top: clamp(56px, 11vw, 120px);
  }
  .well-s01-005 .slot { aspect-ratio: 4 / 5; }
  .well-s01-005 .card {
    grid-column: 1 / 9;
    grid-row: 2;
    align-self: end;
    margin-bottom: clamp(-34px, -3vw, -18px);
  }
  .well-s01-005 .copy {
    grid-column: 1 / -1;
    grid-row: 3;
    align-self: start;
    padding-top: clamp(34px, 4vw, 52px);
    padding-bottom: 0;
  }
  .well-s01-005 .lead { max-width: 42ch; }
}

@media (max-width: 768px) {
  .well-s01-005 h1 { font-size: clamp(3rem, 16vw, 7rem); }
  .well-s01-005 .media {
    grid-column: 2 / 13;
    margin-top: clamp(44px, 13vw, 90px);
  }
  .well-s01-005 .slot { aspect-ratio: 1 / 1; }
  .well-s01-005 .card { grid-column: 1 / 11; }
  .well-s01-005 .lead { max-width: none; }
}

@media (max-width: 480px) {
  .well-s01-005 .media { grid-column: 1 / -1; margin-top: clamp(36px, 15vw, 64px); }
  .well-s01-005 .card {
    grid-column: 1 / -1;
    margin-bottom: -16px;
    border-radius: 12px;
  }
  .well-s01-005 .card-slot { width: 58px; }
  .well-s01-005 h1 { letter-spacing: -0.04em; }
}

@media (prefers-reduced-motion: reduce) {
  .well-s01-005 * { transition: none !important; }
}
</style>
</head>
<body>

<main class="well-s01-005" data-study-id="WELL-S01-005" data-direction="Art-directed / Distinctive">
  <section class="hero" aria-labelledby="well-s01-005-title">
    <div class="stage">
      <div class="canvas">

        <div class="typeplane">
          <h1 id="well-s01-005-title">
            <span class="line">the long</span>
            <span class="line line--in">exhale</span>
          </h1>
        </div>

        <div class="media">
          <div class="slot">
            <span class="slot-label">Treatment portrait</span>
          </div>
        </div>

        <aside class="card">
          <div class="card-slot"><span>Detail</span></div>
          <div class="card-text">
            <h2>Signature facial</h2>
            <p>Hands-on from the first minute to the last.</p>
          </div>
        </aside>

        <div class="copy">
          <p class="eyebrow">Signature treatments</p>
          <p class="lead">Unhurried work, shaped in the room around the skin you arrive with.</p>
          <a class="textlink" href="#well-s01-005-title">
            See what a session involves
            <span aria-hidden="true">&rarr;</span>
          </a>
        </div>

      </div>
    </div>
  </section>
</main>

</body>
</html>
