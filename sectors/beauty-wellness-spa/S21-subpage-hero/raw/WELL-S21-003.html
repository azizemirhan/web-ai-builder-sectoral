<!--
  WebAIBuilder — Sector Design Authoring Workspace
  Raw study. Standalone HTML. Scoped CSS. No framework, CDN, or remote runtime dependency.

  Study ID       : WELL-S21-003
  Sector         : Beauty, Wellness & Spa (WELL)
  Section        : WELL-S21 — Subpage Hero
  Direction      : Dense / Information-heavy
  Reference      : None. Originated for this batch; no reference images were supplied.
  Layout model   : The hero of an article page — parent label, a reserved title area, a reserved
                   standfirst area, and a four-item metadata strip along the foot
  Density        : High for this role — the densest hero in the batch, and still shallower than any
                   S01 study
  Media mode     : None. The density is in the metadata; a picture as well would make an interior
                   hero taller than the article it introduces.
  Interaction    : None (static; no JavaScript)
  Why the title is reserved : This is the hero of an `S25` article page, and **an article title is
                   invented content** — the `S18` rule. Writing one here would invent a publication
                   and, in this sector, would very likely also be an efficacy claim. So the densest
                   study in the batch is also the one whose largest element is empty, which is the
                   honest result rather than an awkward one.
  The metadata, filtered : The canonical scope for this role allows *category, date, reading time,
                   discipline or reference*. Read through this sector's claims rule: topic and kind
                   are **real**, the date is a **reserved field**, the author is a **reserved
                   token**, and **reading time is omitted entirely** — a placeholder cannot compute
                   it and this sector prints no durations.
  The S01 test   : A homepage hero has no publication metadata and never leaves its own headline
                   empty. This study could not stand in for one.
  Content note   : No invented title, standfirst, author name, date, reading time, view or share
                   count; no breadcrumb, trail or parent link; no viewport-height unit.
-->

<meta name="study-id" content="WELL-S21-003">
<meta name="sector" content="Beauty, Wellness &amp; Spa">
<meta name="sector-prefix" content="WELL">
<meta name="section-id" content="WELL-S21">
<meta name="section-name" content="Subpage Hero">

<meta name="direction" content="Dense / Information-heavy">

<meta name="media-mode" content="none">
<meta name="interaction" content="none">
<meta name="dependencies" content="none">

<title>WELL-S21-003 — Subpage Hero, Dense / Information-heavy</title>

<style>
/* Standalone host baseline */
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: #e9ece6; }

/* Scoped study styles — namespaced to .well-s21-003 */
.well-s21-003 {
  --ink: #1f251f;
  --ink-soft: #5c6659;
  --paper: #e9ece6;
  --slot: #e0e4dc;
  --slot-ink: #59634f;
  --slot-edge: #c8cfc0;
  --chip: #e3e7df;
  --rule: #ccd4c6;

  box-sizing: border-box;
  display: block;
  background: var(--paper);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 1rem;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
.well-s21-003 *,
.well-s21-003 *::before,
.well-s21-003 *::after { box-sizing: inherit; }
.well-s21-003 .vh {
  position: absolute;
  width: 1px; height: 1px;
  margin: -1px; padding: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

.well-s21-003 .shell {
  width: 100%;
  max-width: 1240px;
  margin: 0 auto;
  padding: clamp(30px, 3.4vw, 56px) clamp(20px, 3.6vw, 52px) clamp(22px, 2.6vw, 36px);
}

.well-s21-003 .parent {
  margin: 0 0 clamp(12px, 1.4vw, 16px);
  font-size: 0.7rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink-soft);
}

/* Reserved page identity */
.well-s21-003 .title-slot {
  border: 1px dashed var(--slot-edge);
  border-radius: 10px;
  background: var(--slot);
  display: grid;
  place-items: center;
  padding: clamp(16px, 2vw, 24px);
  min-height: clamp(92px, 8.4vw, 122px);
  max-width: 30rem;
  text-align: center;
}
.well-s21-003 .stand-slot {
  margin-top: clamp(12px, 1.4vw, 16px);
  border: 1px dashed var(--slot-edge);
  border-radius: 10px;
  background: var(--slot);
  display: grid;
  place-items: center;
  padding: clamp(14px, 1.6vw, 20px);
  min-height: clamp(58px, 5vw, 72px);
  max-width: 42rem;
  text-align: center;
}
.well-s21-003 .title-slot span,
.well-s21-003 .stand-slot span {
  font-size: 0.6rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--slot-ink);
  line-height: 1.7;
}

/* Metadata strip */
.well-s21-003 .meta {
  margin: clamp(22px, 2.6vw, 34px) 0 0;
  padding: 0;
  padding-top: clamp(16px, 1.9vw, 24px);
  border-top: 1px solid var(--rule);
  list-style: none;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: clamp(14px, 2vw, 34px);
  max-width: 62rem;
}
.well-s21-003 .meta li { min-width: 0; }
.well-s21-003 .fname {
  display: block;
  margin-bottom: 7px;
  font-size: 0.6rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--ink-soft);
}
.well-s21-003 .value { font-size: 0.96rem; font-weight: 600; }
.well-s21-003 .slot {
  display: inline-block;
  padding: 3px 11px;
  border-radius: 6px;
  background: var(--chip);
  color: var(--ink-soft);
  font-size: 0.92rem;
}

/* Responsive ladder — metadata wraps rather than truncates */
@media (max-width: 900px) {
  .well-s21-003 .meta { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(14px, 2vw, 22px); }
}

@media (max-width: 480px) {
  .well-s21-003 .meta { grid-template-columns: minmax(0, 1fr); }
  .well-s21-003 .title-slot,
  .well-s21-003 .stand-slot { max-width: none; }
}

@media (prefers-reduced-motion: reduce) {
  .well-s21-003 * { transition: none !important; }
}
</style>
</head>
<body>

<div class="well-s21-003" data-study-id="WELL-S21-003" data-direction="Dense / Information-heavy">
  <section class="shell" aria-labelledby="well-s21-003-title">

    <h1 class="vh" id="well-s21-003-title">Article page hero</h1>
    <p class="parent">Wellness resources</p>

    <div class="title-slot"><span>Article title<br>two lines</span></div>
    <div class="stand-slot"><span>Standfirst<br>one or two lines</span></div>

    <ul class="meta">
      <li>
        <span class="fname">Topic</span>
        <span class="value">Skin</span>
      </li>
      <li>
        <span class="fname">Kind</span>
        <span class="value">A guide</span>
      </li>
      <li>
        <span class="fname">Published</span>
        <span class="slot"><span class="vh">Publication date</span><span aria-hidden="true">&mdash;</span></span>
      </li>
      <li>
        <span class="fname">Written by</span>
        <span class="slot"><span class="vh">Author name</span><span aria-hidden="true">&mdash;</span></span>
      </li>
    </ul>

  </section>
</div>

</body>
</html>
