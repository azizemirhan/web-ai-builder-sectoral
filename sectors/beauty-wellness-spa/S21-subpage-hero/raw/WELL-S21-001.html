<!--
  WebAIBuilder — Sector Design Authoring Workspace
  Raw study. Standalone HTML. Scoped CSS. No framework, CDN, or remote runtime dependency.

  Study ID       : WELL-S21-001
  Sector         : Beauty, Wellness & Spa (WELL)
  Section        : WELL-S21 — Subpage Hero
  Direction      : Universal / Safe
  Reference      : None. Originated for this batch; no reference images were supplied.
  Layout model   : A parent label, the page title and one framing line held to the left, with a wide
                   short reserved media band beneath — the whole section deliberately shallow
  Density        : Low
  Media mode     : One reserved media band, held to a fixed shallow height at desktop widths. **Short on purpose:** an interior hero with a
                   tall image makes the visitor scroll to reach the thing they came for, and they
                   arrived wanting the content rather than an entrance.
  Interaction    : None (static; no JavaScript)
  The S01 test   : This study is authored to **fail** as a homepage hero. It carries no proposition
                   about the studio, no manifesto, no reason-to-choose-us line and no action — only
                   where you are and what this page holds. See ../README.md.
  No breadcrumb  : The parent label is a **word, not a link**. Naming the category a page belongs to
                   is page identity; linking up the hierarchy is S22.
  Content note   : "Facials" is generic sector vocabulary, as used in S03. No invented item count,
                   price, rating, review count, duration or reading time; no invented practitioner
                   name; no viewport-height unit anywhere in the CSS.
-->

<meta name="study-id" content="WELL-S21-001">
<meta name="sector" content="Beauty, Wellness &amp; Spa">
<meta name="sector-prefix" content="WELL">
<meta name="section-id" content="WELL-S21">
<meta name="section-name" content="Subpage Hero">
<meta name="variant" content="001">
<meta name="territory" content="Universal / Safe">
<meta name="direction" content="Universal / Safe">
<meta name="layout-model" content="Left-held page identity above a wide short reserved media band">
<meta name="density" content="low">
<meta name="media-mode" content="one-short-reserved-band">
<meta name="interaction" content="none">
<meta name="dependencies" content="none">
<meta name="batch" content="V1">

<title>WELL-S21-001 — Subpage Hero, Universal / Safe</title>

<style>
/* Standalone host baseline */
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: #eef1f3; }

/* Scoped study styles — namespaced to .well-s21-001 */
.well-s21-001 {
  --ink: #1e242a;
  --ink-soft: #5b6670;
  --paper: #eef1f3;
  --slot: #e2e7ea;
  --slot-ink: #59636d;
  --slot-edge: #c9d1d7;
  --rule: #d3dade;

  box-sizing: border-box;
  display: block;
  background: var(--paper);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 1rem;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
.well-s21-001 *,
.well-s21-001 *::before,
.well-s21-001 *::after { box-sizing: inherit; }

.well-s21-001 .shell {
  width: 100%;
  max-width: 1320px;
  margin: 0 auto;
  padding: clamp(32px, 3.6vw, 60px) clamp(20px, 3.6vw, 52px) clamp(26px, 3vw, 44px);
}

.well-s21-001 .parent {
  margin: 0 0 clamp(10px, 1.2vw, 14px);
  font-size: 0.72rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.well-s21-001 h1 {
  margin: 0;
  font-size: clamp(1.75rem, 3.2vw, 2.7rem);
  line-height: 1.08;
  letter-spacing: -0.022em;
  font-weight: 550;
  max-width: 16ch;
}
.well-s21-001 .frames {
  margin: clamp(12px, 1.5vw, 18px) 0 0;
  max-width: 56ch;
  color: var(--ink-soft);
  font-size: clamp(0.98rem, 1.05vw, 1.06rem);
  line-height: 1.62;
}

.well-s21-001 .band {
  margin: clamp(22px, 2.6vw, 38px) 0 0;
  border: 1px dashed var(--slot-edge);
  border-radius: 12px;
  background: var(--slot);
  height: clamp(190px, 17vw, 250px);
  display: grid;
  place-items: center;
  padding: 16px;
}
.well-s21-001 .band span {
  font-size: 0.64rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--slot-ink);
  text-align: center;
}

.well-s21-001 .close {
  margin: clamp(20px, 2.4vw, 30px) 0 0;
  padding-top: clamp(14px, 1.6vw, 20px);
  border-top: 1px solid var(--rule);
  color: var(--ink-soft);
  font-size: 0.88rem;
}

/* Responsive ladder — the title survives, the media gives way first */
@media (max-width: 768px) {
  .well-s21-001 h1,
  .well-s21-001 .frames { max-width: none; }
  .well-s21-001 .band { height: auto; aspect-ratio: 16 / 7; }
}

@media (max-width: 480px) {
  .well-s21-001 .band { aspect-ratio: 3 / 2; }
}

@media (prefers-reduced-motion: reduce) {
  .well-s21-001 * { transition: none !important; }
}
</style>
</head>
<body>

<div class="well-s21-001" data-study-id="WELL-S21-001" data-direction="Universal / Safe">
  <section class="shell" aria-labelledby="well-s21-001-title">

    <p class="parent">Treatments</p>
    <h1 id="well-s21-001-title">Facials</h1>
    <p class="frames">Everything we do that happens to your face, with what each one is for and who tends to book it. If you are not sure which, the first one on the list is the one we suggest most often.</p>

    <div class="band"><span>Media &mdash; a treatment room</span></div>

    <p class="close">What each one involves, and what it costs, is further down the page.</p>

  </section>
</div>

</body>
</html>
