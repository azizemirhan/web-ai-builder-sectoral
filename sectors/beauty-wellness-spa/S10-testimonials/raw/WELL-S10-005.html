<!--
  WebAIBuilder — Sector Design Authoring Workspace
  Raw study. Standalone HTML. Scoped CSS. No framework, CDN, or remote runtime dependency.

  Study ID       : WELL-S10-005
  Sector         : Beauty, Wellness & Spa (WELL)
  Section        : WELL-S10 — Testimonials
  Direction      : Art-directed / Distinctive
  Reference      : None. Originated for this batch; no reference images were supplied.
  Layout model   : A wall. Six reserved quotation areas of six different widths and heights packed
                   into a twelve-column field over an oversized decorative quotation mark, so the
                   section reads as a body of voices rather than as a row of cards
  Density        : Low — six quotations, no supporting copy beyond the header and one closing line
  Media mode     : Six reserved quotation areas at six different proportions. No portraits: at
                   this density a portrait per brick would turn a wall of voices into a wall of
                   faces, which is S04's role.
  Interaction    : None (static; no JavaScript)
  Contrast note  : The oversized quotation mark sits at 1.55:1 against the ground, as a
                   watermark. It is decorative and marked `aria-hidden`: it carries no information
                   the section's heading does not already carry. This follows the precedent set in
                   WELL-S07-005 and is the opposite case to WELL-S01-005, where low-contrast
                   display type was the study's `h1` and had to be raised. Every element that
                   conveys meaning here is at full contrast.
  Reserved-quote note : The quotation structure is authored; the quotation is reserved. The
                   unequal brick sizes are the device — a wall of identically sized quotes is a
                   grid, and real quotations are never the same length.
  Content note   : No invented quotation, guest name, initial, age, location, photograph,
                   treatment attribution or occupation. No star rating, score, average or review
                   count, and no review-platform name. See ../README.md.
-->

<title>WELL-S10-005 — Testimonials, Art-directed / Distinctive</title>

<style>
/* Standalone host baseline */
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: #17161a; }

/* Scoped study styles — namespaced to .well-s10-005 */
.well-s10-005 {
  --ink: #f0eef2;
  --ink-soft: #9a95a3;
  --paper: #17161a;
  --mark: #3b3647;
  --slot: #211f26;
  --slot-ink: #a8a2b2;
  --slot-edge: #383343;
  --line: #2c2934;
  --focus: #d8c7e6;

  box-sizing: border-box;
  display: block;
  background: var(--paper);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 1rem;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
.well-s10-005 *,
.well-s10-005 *::before,
.well-s10-005 *::after { box-sizing: inherit; }
.well-s10-005 :focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 4px;
  border-radius: 4px;
}

.well-s10-005 .shell {
  width: 100%;
  max-width: 1400px;
  margin: 0 auto;
  padding: clamp(48px, 5.6vw, 100px) clamp(20px, 3.6vw, 56px);
}

/* Header */
.well-s10-005 .head {
  max-width: 42rem;
  margin-bottom: clamp(28px, 3.4vw, 50px);
}
.well-s10-005 .eyebrow {
  margin: 0 0 clamp(12px, 1.4vw, 18px);
  font-size: 0.7rem;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.well-s10-005 h1 {
  margin: 0;
  font-size: clamp(1.8rem, 3.2vw, 2.8rem);
  line-height: 1.1;
  letter-spacing: -0.02em;
  font-weight: 550;
  max-width: 18ch;
}

/* The wall */
.well-s10-005 .wall {
  position: relative;
  overflow: hidden;
  padding-top: clamp(58px, 7.5vw, 128px);
}

/* Decorative watermark — aria-hidden, never load-bearing */
.well-s10-005 .glyph {
  position: absolute;
  top: 0;
  right: 2%;
  z-index: 0;
  color: var(--mark);
  font-family: Georgia, "Times New Roman", Times, serif;
  font-size: clamp(14rem, 32vw, 30rem);
  line-height: 1;
  pointer-events: none;
  user-select: none;
}

.well-s10-005 .bricks {
  position: relative;
  z-index: 1;
  margin: 0;
  padding: 0;
  list-style: none;
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  gap: clamp(12px, 1.4vw, 20px);
}
.well-s10-005 .bricks li { min-width: 0; }
.well-s10-005 .bricks li:nth-child(1) { grid-column: span 5; }
.well-s10-005 .bricks li:nth-child(2) { grid-column: span 4; }
.well-s10-005 .bricks li:nth-child(3) { grid-column: span 3; }
.well-s10-005 .bricks li:nth-child(4) { grid-column: span 4; }
.well-s10-005 .bricks li:nth-child(5) { grid-column: span 3; }
.well-s10-005 .bricks li:nth-child(6) { grid-column: span 5; }

.well-s10-005 .card { margin: 0; }
.well-s10-005 .quote-slot {
  border: 1px dashed var(--slot-edge);
  background: var(--slot);
  display: grid;
  place-items: center;
  padding: 16px;
  text-align: center;
}
.well-s10-005 .bricks li:nth-child(1) .quote-slot { min-height: clamp(150px, 15vw, 200px); }
.well-s10-005 .bricks li:nth-child(2) .quote-slot { min-height: clamp(196px, 20vw, 268px); }
.well-s10-005 .bricks li:nth-child(3) .quote-slot { min-height: clamp(122px, 12vw, 162px); }
.well-s10-005 .bricks li:nth-child(4) .quote-slot { min-height: clamp(150px, 15vw, 200px); }
.well-s10-005 .bricks li:nth-child(5) .quote-slot { min-height: clamp(196px, 20vw, 268px); }
.well-s10-005 .bricks li:nth-child(6) .quote-slot { min-height: clamp(122px, 12vw, 162px); }

.well-s10-005 .quote-slot span {
  font-size: 0.6rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--slot-ink);
  line-height: 1.6;
}
.well-s10-005 .who {
  display: block;
  margin-top: clamp(9px, 1.1vw, 13px);
  font-size: 0.78rem;
  letter-spacing: 0.08em;
  color: var(--ink-soft);
}

/* Closing line */
.well-s10-005 .foot {
  margin: clamp(28px, 3.4vw, 48px) 0 0;
  padding-top: clamp(18px, 2.2vw, 28px);
  border-top: 1px solid var(--line);
  max-width: 60ch;
  color: var(--ink-soft);
  font-size: 0.92rem;
}

/* Responsive ladder — the wall keeps unequal bricks, at fewer per row */
@media (max-width: 1024px) {
  .well-s10-005 .bricks { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .well-s10-005 .bricks li:nth-child(1) { grid-column: span 4; }
  .well-s10-005 .bricks li:nth-child(2) { grid-column: span 2; }
  .well-s10-005 .bricks li:nth-child(3) { grid-column: span 3; }
  .well-s10-005 .bricks li:nth-child(4) { grid-column: span 3; }
  .well-s10-005 .bricks li:nth-child(5) { grid-column: span 2; }
  .well-s10-005 .bricks li:nth-child(6) { grid-column: span 4; }
}

@media (max-width: 768px) {
  .well-s10-005 .bricks { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .well-s10-005 .bricks li:nth-child(1),
  .well-s10-005 .bricks li:nth-child(2),
  .well-s10-005 .bricks li:nth-child(3),
  .well-s10-005 .bricks li:nth-child(4),
  .well-s10-005 .bricks li:nth-child(5),
  .well-s10-005 .bricks li:nth-child(6) { grid-column: span 1; }
  .well-s10-005 h1 { max-width: none; }
  .well-s10-005 .glyph { font-size: clamp(11rem, 44vw, 18rem); }
}

@media (max-width: 480px) {
  .well-s10-005 .bricks { grid-template-columns: minmax(0, 1fr); }
  .well-s10-005 .glyph { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  .well-s10-005 * { transition: none !important; }
}
</style>
