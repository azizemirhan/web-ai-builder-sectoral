<!--

  Density        : Low (60–120)
  Media mode     : Three reserved quotation areas (short / long / medium) and three reserved
                   portrait fields. No quotation, name or image is supplied.

<title>WELL-S10-001 — Testimonials, Universal / Safe</title>

<style>
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: #f2f0ea; }

.well-s10-001 {
  --paper: #f2f0ea; --ink: #23281f; --muted: #6a6d62; --line: #d3d0c5; --line-strong: #23281f;
  --media: #e1dfd5; --accent: #5a6b48;
  --serif: Georgia, "Times New Roman", "Iowan Old Style", serif;
  box-sizing: border-box; display: block; background: var(--paper); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 1rem; line-height: 1.6; -webkit-font-smoothing: antialiased;
}
.well-s10-001 *, .well-s10-001 *::before, .well-s10-001 *::after { box-sizing: inherit; }
.well-s10-001 :focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

.well-s10-001 .shell { width: min(100%, 92rem); margin: 0 auto; padding: clamp(2.5rem, 6vw, 6rem) clamp(1rem, 4vw, 4rem); }
.well-s10-001 .head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(16rem, 0.6fr); gap: 3rem; align-items: end; margin-bottom: clamp(1.6rem, 3vw, 3rem); }
.well-s10-001 .eyebrow { margin: 0 0 1rem; color: var(--accent); font-size: 0.62rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; }
.well-s10-001 h2 { margin: 0; max-width: 14ch; font-family: var(--serif); font-weight: 400; font-size: clamp(2.2rem, 3.8vw, 3.8rem); line-height: 0.98; letter-spacing: -0.035em; }
.well-s10-001 h2 em { font-style: italic; }
.well-s10-001 .lead { max-width: 26rem; margin: 0 0 0.3rem auto; color: var(--muted); font-size: 0.86rem; line-height: 1.55; text-align: right; }

.well-s10-001 .cells { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line-strong); border-bottom: 1px solid var(--line); }
.well-s10-001 .cells > li { display: flex; flex-direction: column; min-width: 0; padding: clamp(1.2rem, 2vw, 2rem) clamp(0.9rem, 1.6vw, 1.6rem); }
.well-s10-001 .cells > li + li { border-left: 1px solid var(--line); }
.well-s10-001 figure { display: flex; flex-direction: column; flex: 1; margin: 0; }
.well-s10-001 .quote { position: relative; background: var(--media); border-radius: 3px; }
.well-s10-001 .quote.short { height: 7rem; }
.well-s10-001 .quote.medium { height: 10rem; }
.well-s10-001 .quote.long { height: 14rem; }
.well-s10-001 .glyph { position: absolute; left: 0.8rem; top: 0.3rem; margin: 0; color: var(--accent); font-family: var(--serif); font-size: 2.4rem; line-height: 1; }
.well-s10-001 .slate { position: absolute; left: 0.8rem; bottom: 0.7rem; margin: 0; color: var(--muted); font-size: 0.55rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; }
.well-s10-001 figcaption { display: flex; align-items: center; gap: 0.8rem; margin-top: auto; padding-top: 1rem; }
.well-s10-001 .portrait { position: relative; width: 2.8rem; height: 2.8rem; flex: 0 0 auto; background: var(--media); border-radius: 3px; }
.well-s10-001 .who { margin: 0; font-size: 0.66rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; }
.well-s10-001 .who span { display: block; margin-top: 0.1rem; color: var(--muted); font-weight: 400; letter-spacing: 0; text-transform: none; font-size: 0.78rem; }

@media (max-width: 1024px) {
  .well-s10-001 .cells { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .well-s10-001 .cells > li:nth-child(3) { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); }
  .well-s10-001 .cells > li:nth-child(3) .quote.medium { height: 8rem; }
}
@media (max-width: 768px) { .well-s10-001 .head { grid-template-columns: minmax(0, 1fr); gap: 1rem; } .well-s10-001 .lead { margin-left: 0; text-align: left; } .well-s10-001 h2 { max-width: none; } }
@media (max-width: 480px) { .well-s10-001 .cells { grid-template-columns: minmax(0, 1fr); } .well-s10-001 .cells > li { padding-inline: 0; } .well-s10-001 .cells > li + li { border-left: 0; border-top: 1px solid var(--line); } }
@media (prefers-reduced-motion: reduce) { .well-s10-001 * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>

<div class="well-s10-001" data-study-id="WELL-S10-001" data-direction="Universal / Safe">
  <section class="shell" aria-labelledby="well-s10-001-title">

    <div class="head">
      <div>
        <p class="eyebrow">What guests say</p>
        <h2 id="well-s10-001-title">In their words, <em>not</em> ours</h2>
      </div>
      <p class="lead">Everything here is published with permission and printed as it was written. Nothing is edited for length and nothing is given in exchange.</p>
    </div>

    <ul class="cells">
      <li><figure><div class="quote short" role="img" aria-label="Reserved quotation area, short"><p class="glyph" aria-hidden="true">&#8220;</p><p class="slate" aria-hidden="true">Quotation area &middot; short</p></div><figcaption><div class="portrait" role="img" aria-label="Reserved portrait field"></div><p class="who">Guest 01<span>Attribution reserved</span></p></figcaption></figure></li>
      <li><figure><div class="quote long" role="img" aria-label="Reserved quotation area, long"><p class="glyph" aria-hidden="true">&#8220;</p><p class="slate" aria-hidden="true">Quotation area &middot; long</p></div><figcaption><div class="portrait" role="img" aria-label="Reserved portrait field"></div><p class="who">Guest 02<span>Attribution reserved</span></p></figcaption></figure></li>
      <li><figure><div class="quote medium" role="img" aria-label="Reserved quotation area, medium"><p class="glyph" aria-hidden="true">&#8220;</p><p class="slate" aria-hidden="true">Quotation area &middot; medium</p></div><figcaption><div class="portrait" role="img" aria-label="Reserved portrait field"></div><p class="who">Guest 03<span>Attribution reserved</span></p></figcaption></figure></li>
    </ul>

  </section>
</div>
