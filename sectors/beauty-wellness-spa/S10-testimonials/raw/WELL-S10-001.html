<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!--
  WebAIBuilder — Sector Design Authoring Workspace
  Raw study. Standalone HTML. Scoped CSS. No framework, CDN, or remote runtime dependency.

  Study ID       : WELL-S10-001
  Sector         : Beauty, Wellness & Spa (WELL)
  Section        : WELL-S10 — Testimonials
  Direction      : Universal / Safe
  Reference      : None. Originated for this batch; no reference images were supplied.
  Layout model   : Section header carrying the gathering policy, above three equal quotation cards
                   — each a reserved quotation area over an attribution row with a small reserved
                   portrait
  Density        : Low
  Media mode     : Three reserved quotation areas at three lengths (short, medium, long) plus three
                   small reserved portrait slots.
  Interaction    : None (static; no JavaScript)
  Reserved-quote note : The quotation structure is authored; the quotation is reserved. Each
                   quote area is sized to the length of quote it expects, so measure, rhythm and
                   card balance are demonstrable without inventing a word. In a real
                   implementation the reserved area is replaced by a <blockquote> and the token by
                   the guest's own attribution.
  Content note   : No invented quotation, guest name, initial, age, location, photograph,
                   treatment attribution or occupation. **No star rating, score, average or review
                   count**, and no review-platform name — a figure cannot be meaningfully reserved,
                   and an empty star row would assert a rating system the studio may not run. See
                   ../README.md. The only unreserved text is the studio's own policy on how quotes
                   are gathered, which is a fact about the studio.
-->

<meta name="study-id" content="WELL-S10-001">
<meta name="sector" content="Beauty, Wellness &amp; Spa">
<meta name="sector-prefix" content="WELL">
<meta name="section-id" content="WELL-S10">
<meta name="section-name" content="Testimonials">
<meta name="variant" content="001">
<meta name="territory" content="Universal / Safe">
<meta name="direction" content="Universal / Safe">
<meta name="layout-model" content="Three equal quotation cards with reserved quote areas at three lengths">
<meta name="density" content="low">
<meta name="media-mode" content="reserved-quotation-areas-plus-portrait-slots">
<meta name="interaction" content="none">
<meta name="dependencies" content="none">
<meta name="batch" content="V1">

<title>WELL-S10-001 — Testimonials, Universal / Safe</title>

<style>
/* Standalone host baseline */
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: #eaeee9; }

/* Scoped study styles — namespaced to .well-s10-001 */
.well-s10-001 {
  --ink: #202521;
  --ink-soft: #5f6a60;
  --paper: #eaeee9;
  --card: #ffffff;
  --slot: #e4e9e3;
  --slot-ink: #6d786d;
  --slot-edge: #d3dbd2;
  --line: #e0e5df;
  --focus: #35513c;

  box-sizing: border-box;
  display: block;
  background: var(--paper);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 1rem;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
.well-s10-001 *,
.well-s10-001 *::before,
.well-s10-001 *::after { box-sizing: inherit; }
.well-s10-001 :focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 3px;
  border-radius: 6px;
}

.well-s10-001 .shell {
  width: 100%;
  max-width: 1320px;
  margin: 0 auto;
  padding: clamp(44px, 5vw, 88px) clamp(20px, 3.6vw, 52px);
}

/* Header */
.well-s10-001 .head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: clamp(20px, 3vw, 56px);
  align-items: end;
  margin-bottom: clamp(24px, 3vw, 42px);
}
.well-s10-001 .eyebrow {
  margin: 0 0 clamp(12px, 1.4vw, 18px);
  font-size: 0.72rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.well-s10-001 h1 {
  margin: 0;
  font-size: clamp(1.8rem, 3.3vw, 2.8rem);
  line-height: 1.1;
  letter-spacing: -0.02em;
  font-weight: 550;
  max-width: 16ch;
}
.well-s10-001 .head p {
  margin: 0;
  max-width: 44ch;
  color: var(--ink-soft);
  font-size: 1rem;
}

/* Quotation cards */
.well-s10-001 .quotes {
  margin: 0;
  padding: 0;
  list-style: none;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: clamp(14px, 1.8vw, 26px);
}
.well-s10-001 .quotes li { min-width: 0; display: flex; }
.well-s10-001 .card {
  margin: 0;
  width: 100%;
  background: var(--card);
  border-radius: 16px;
  padding: clamp(18px, 2.2vw, 30px);
  display: flex;
  flex-direction: column;
}

/* The reserved quotation area */
.well-s10-001 .quote-slot {
  border: 1px dashed var(--slot-edge);
  border-radius: 10px;
  background: var(--slot);
  display: grid;
  place-items: center;
  padding: 16px;
  text-align: center;
}
.well-s10-001 .q-short { min-height: clamp(112px, 11vw, 150px); }
.well-s10-001 .q-medium { min-height: clamp(150px, 15vw, 200px); }
.well-s10-001 .q-long { min-height: clamp(188px, 19vw, 250px); }
.well-s10-001 .quote-slot span {
  font-size: 0.62rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--slot-ink);
  line-height: 1.6;
}

/* Attribution */
.well-s10-001 .attrib {
  margin: clamp(16px, 1.8vw, 22px) 0 0;
  padding-top: clamp(14px, 1.6vw, 20px);
  border-top: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: clamp(11px, 1.2vw, 15px);
}
.well-s10-001 .portrait {
  flex: none;
  width: clamp(38px, 3.6vw, 48px);
  aspect-ratio: 1 / 1;
  border-radius: 999px;
  background: var(--slot);
  display: grid;
  place-items: center;
}
.well-s10-001 .portrait span {
  font-size: 0.5rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--slot-ink);
}
.well-s10-001 .who {
  font-size: 0.85rem;
  letter-spacing: 0.06em;
  color: var(--ink-soft);
}

/* Responsive ladder */
@media (max-width: 1024px) {
  .well-s10-001 .quotes { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .well-s10-001 .quotes li:last-child { grid-column: 1 / -1; }
  .well-s10-001 .q-long { min-height: clamp(130px, 14vw, 170px); }
}

@media (max-width: 768px) {
  .well-s10-001 .head {
    grid-template-columns: minmax(0, 1fr);
    align-items: start;
    gap: clamp(14px, 2vw, 20px);
  }
  .well-s10-001 h1 { max-width: none; }
  .well-s10-001 .head p { max-width: none; }
}

@media (max-width: 480px) {
  .well-s10-001 .quotes { grid-template-columns: minmax(0, 1fr); }
  .well-s10-001 .quotes li:last-child { grid-column: auto; }
  .well-s10-001 .card { border-radius: 13px; }
}

@media (prefers-reduced-motion: reduce) {
  .well-s10-001 * { transition: none !important; }
}
</style>
</head>
<body>

<div class="well-s10-001" data-study-id="WELL-S10-001" data-direction="Universal / Safe">
  <section class="shell" aria-labelledby="well-s10-001-title">

    <div class="head">
      <div>
        <p class="eyebrow">What guests say</p>
        <h1 id="well-s10-001-title">In their words, not ours</h1>
      </div>
      <p>Everything here is published with permission and printed as it was written. Nothing is edited for length and nothing is given in exchange.</p>
    </div>

    <ul class="quotes">
      <li>
        <figure class="card">
          <div class="quote-slot q-short"><span>Guest quotation<br>short</span></div>
          <figcaption class="attrib">
            <div class="portrait"><span>&mdash;</span></div>
            <span class="who">Guest 01</span>
          </figcaption>
        </figure>
      </li>
      <li>
        <figure class="card">
          <div class="quote-slot q-long"><span>Guest quotation<br>long</span></div>
          <figcaption class="attrib">
            <div class="portrait"><span>&mdash;</span></div>
            <span class="who">Guest 02</span>
          </figcaption>
        </figure>
      </li>
      <li>
        <figure class="card">
          <div class="quote-slot q-medium"><span>Guest quotation<br>medium</span></div>
          <figcaption class="attrib">
            <div class="portrait"><span>&mdash;</span></div>
            <span class="who">Guest 03</span>
          </figcaption>
        </figure>
      </li>
    </ul>

  </section>
</div>

</body>
</html>
