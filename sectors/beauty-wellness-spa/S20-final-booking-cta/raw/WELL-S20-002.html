<!--
  WebAIBuilder — Sector Design Authoring Workspace
  Raw study. Standalone HTML. Scoped CSS. No framework, CDN, or remote runtime dependency.

  Study ID       : WELL-S20-002
  Sector         : Beauty, Wellness & Spa (WELL)
  Section        : WELL-S20 — Final Booking CTA
  Direction      : Premium / Editorial
  Reference      : None. Originated for this batch; no reference images were supplied.
  Layout model   : One serif sentence at display scale, one action set as a ruled link beneath it,
                   and a single quiet line under that. Nothing else on the page.
  Density        : Very low — the fewest elements of any study in the WELL sector
  Media mode     : None.
  Interaction    : None (static; no JavaScript). No form field, no select, no date, no time.
  The editorial argument : **At the foot of a wellness page the closing ask should be the quietest
                   thing on it.** A loud final CTA reads as a business that needs the booking, which
                   is the opposite of what this sector is selling. So the study spends everything on
                   one sentence, gives the action the weight of a printed line rather than a
                   coloured button, and stops.
  Why a ruled link rather than a button : A filled pill is the visual grammar of urgency. A large
                   ruled link is unmistakably an action, keeps a 52px target, and does not raise its
                   voice. This is the only study in the batch whose action is not a filled shape.
  Content note   : No countdown, deadline, scarcity or availability line; no client, booking or
                   review count; no rating, testimonial, price, discount or offer; no invented
                   figure of any kind.
-->

<meta name="sector" content="Beauty, Wellness &amp; Spa">

<title>WELL-S20-002 — Final Booking CTA, Premium / Editorial</title>

<style>
/* Standalone host baseline */
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: #f6f1ea; }

/* Scoped study styles — namespaced to .well-s20-002 */
.well-s20-002 {
  --ink: #262014;
  --ink-soft: #6d634e;
  --paper: #f6f1ea;
  --rule: #d9cfba;
  --focus: #4c4229;

  box-sizing: border-box;
  display: block;
  background: var(--paper);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 1rem;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
.well-s20-002 *,
.well-s20-002 *::before,
.well-s20-002 *::after { box-sizing: inherit; }
.well-s20-002 :focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 6px;
  border-radius: 3px;
}

.well-s20-002 .shell {
  width: 100%;
  max-width: 1140px;
  margin: 0 auto;
  padding: clamp(64px, 8vw, 168px) clamp(20px, 3.6vw, 56px);
}

.well-s20-002 .eyebrow {
  margin: 0 0 clamp(18px, 2vw, 28px);
  font-size: 0.7rem;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.well-s20-002 h1 {
  margin: 0;
  font-family: Georgia, "Times New Roman", Times, serif;
  font-size: clamp(2rem, 4.4vw, 3.7rem);
  line-height: 1.06;
  letter-spacing: -0.016em;
  font-weight: 400;
  max-width: 17ch;
}

/* The action, as a printed line rather than a button */
.well-s20-002 .go {
  display: inline-flex;
  align-items: center;
  gap: clamp(10px, 1.2vw, 16px);
  margin-top: clamp(34px, 4.4vw, 72px);
  min-height: 52px;
  padding-bottom: 10px;
  border-bottom: 2px solid var(--ink);
  color: var(--ink);
  font-family: Georgia, "Times New Roman", Times, serif;
  font-size: clamp(1.3rem, 2.1vw, 1.85rem);
  line-height: 1.2;
  text-decoration: none;
}
.well-s20-002 .go:hover { border-bottom-color: var(--ink-soft); color: var(--ink-soft); }
.well-s20-002 .go .arrow { font-size: 0.8em; }

.well-s20-002 .after {
  margin: clamp(26px, 3.2vw, 44px) 0 0;
  padding-top: clamp(20px, 2.4vw, 30px);
  border-top: 1px solid var(--rule);
  max-width: 58ch;
  color: var(--ink-soft);
  font-size: 0.96rem;
  line-height: 1.66;
}
.well-s20-002 .after b { color: var(--ink); }

/* Responsive ladder */
@media (max-width: 768px) {
  .well-s20-002 h1,
  .well-s20-002 .after { max-width: none; }
}

@media (prefers-reduced-motion: reduce) {
  .well-s20-002 * { transition: none !important; }
}
</style>
</head>
<body>

<div class="well-s20-002" data-study-id="WELL-S20-002" data-direction="Premium / Editorial">
  <section class="shell" aria-labelledby="well-s20-002-title">

    <p class="eyebrow">When you are ready</p>
    <h1 id="well-s20-002-title">There is no good reason to rush this, and no bad time to start.</h1>

    <a class="go" href="#well-s20-002-title">Book a time <span class="arrow" aria-hidden="true">&rarr;</span></a>

    <p class="after"><b>Nothing here expires and nothing is running out.</b> If this is not the week for it, the same page will say the same thing next month, and so will we.</p>

  </section>
</div>

</body>
